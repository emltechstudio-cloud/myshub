<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1e40af">
    <title>MyShub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root {
            --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --text2: #475569; --text3: #94a3b8;
            --border: #e2e8f0; --brand: #1e40af; --brand-light: #3b82f6; --brand-dark: #1e3a8a;
            --radius: 20px; --shadow-md: 0 4px 20px rgba(0,0,0,0.06);
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; }
        .container { max-width: 720px; margin: 0 auto; padding: 20px; }
        .card { background: var(--card); border-radius: var(--radius); padding: 24px; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: var(--shadow-md); }
        .section-title { font-weight: 800; font-size: 1.2rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .catalog-btn { display: block; width: 100%; padding: 14px; background: var(--brand); color: #fff; text-align: center; border-radius: 12px; text-decoration: none; font-weight: 700; transition: var(--transition); }
        .catalog-btn:hover { background: var(--brand-dark); transform: translateY(-2px); }
        .iframe-container { width: 100%; height: 500px; border-radius: 16px; overflow: hidden; border: 1.5px solid var(--border); background: #fff; margin-top: 10px; }
        iframe { width: 100%; height: 100%; border: 0; }
        .youtube-container { position: relative; width: 100%; padding-bottom: 56.25%; border-radius: 16px; overflow: hidden; margin-bottom: 20px; }
        .youtube-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="app" class="container">
        <!-- Shop content will be injected here -->
    </div>

    <script>
        const API = 'https://emltechstudio-myshub-api.hf.space';
        
        async function loadShop() {
            const slug = window.location.pathname.split('/').pop() || 'emltechstudio';
            try {
                const res = await fetch(`${API}/shop/live/${slug}`);
                if (!res.ok) throw new Error('Shop not found');
                const data = await res.json();
                renderShop(data);
            } catch (e) {
                document.getElementById('app').innerHTML = `<h1>404 - Shop Not Found</h1>`;
            }
        }

        function renderShop(shop) {
            const sj = shop.shop_json;
            const plan = shop.plan || 'free';
            const isPro = plan === 'pro' || plan === 'premium';
            
            let html = `
                <header style="text-align:center; margin-bottom:40px;">
                    <img src="${sj.logo_url || 'https://myshub.site/icon.svg'}" style="width:100px; height:100px; border-radius:24px; object-fit:cover; margin-bottom:16px;">
                    <h1 style="font-size:2rem; font-weight:900;">${sj.business_name}</h1>
                    <p style="color:var(--text2);">${sj.tagline || ''}</p>
                </header>
            `;

            // YouTube Preview (Pro/Premium)
            if (isPro && sj.youtube_url) {
                const videoId = sj.youtube_url.split('v=')[1]?.split('&')[0];
                if (videoId) {
                    html += `
                        <div class="youtube-container">
                            <iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>
                        </div>
                    `;
                }
            }

            // About Section
            if (sj.description) {
                html += `
                    <section class="card">
                        <div class="section-title"><i class="fa-solid fa-circle-info"></i> About</div>
                        <p>${sj.description}</p>
                    </section>
                `;
            }

            // Catalog Section (Unified Logic)
            if (sj.catalog_url) {
                const isWhatsApp = sj.catalog_url.includes('wa.me') || sj.catalog_url.includes('whatsapp.com');
                html += `
                    <section class="card">
                        <div class="section-title"><i class="fa-solid fa-bag-shopping"></i> Catalog</div>
                `;

                if (isPro && !isWhatsApp) {
                    // Iframe for Pro/Premium + Non-WhatsApp
                    html += `
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                            <span style="font-size:0.8rem; font-weight:600; color:var(--text2);">Live Preview</span>
                            <a href="${sj.catalog_url}" target="_blank" style="font-size:0.7rem; color:var(--brand); font-weight:700;">Open in New Tab <i class="fa-solid fa-up-right-from-square"></i></a>
                        </div>
                        <div class="iframe-container">
                            <iframe src="${sj.catalog_url}" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
                        </div>
                    `;
                } else {
                    // Button for Free OR WhatsApp
                    html += `
                        <a href="${sj.catalog_url}" target="_blank" class="catalog-btn">
                            <i class="fa-solid fa-store"></i> ${isWhatsApp ? 'View WhatsApp Catalog' : 'Browse Catalog'}
                        </a>
                    `;
                }
                html += `</section>`;
            }

            document.getElementById('app').innerHTML = html;
            
            // Apply Typography
            if (sj.typography?.body_font) {
                document.body.style.fontFamily = sj.typography.body_font + ', sans-serif';
            }
        }

        loadShop();
    </script>
</body>
</html>
