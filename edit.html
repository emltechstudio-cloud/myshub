<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Shop – MyShub</title>
    <style>
        /* ===== EDIT PAGE STYLES ===== */
        .edit-page { padding: 0; }

        .page-header { margin-bottom: 24px; }
        .page-header h2 { font-size: 22px; font-weight: 800; }
        .page-header .sub { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .card .card-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card .card-title .badge {
            font-size: 10px;
            background: var(--brand-soft);
            color: var(--brand);
            padding: 2px 10px;
            border-radius: 30px;
            font-weight: 600;
        }
        .card .card-title .badge.pro { background: var(--brand-soft); color: var(--brand); }
        .card .card-title .badge.premium { background: var(--purple-soft); color: var(--purple); }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--text-secondary); }
        .form-group .required { color: var(--danger); }
        .form-input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            background: var(--surface);
            color: var(--text);
            transition: var(--transition);
            outline: none;
        }
        .form-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
        .form-input::placeholder { color: var(--text-tertiary); }
        textarea.form-input { resize: vertical; min-height: 80px; }
        select.form-input { appearance: auto; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .color-row { display: flex; align-items: center; gap: 10px; }
        .color-input { width: 44px; height: 40px; border-radius: 10px; border: 1.5px solid var(--border); padding: 2px; cursor: pointer; background: var(--surface); }

        /* ===== CUSTOM LINKS CARD ===== */
        .custom-links-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .custom-link-card {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.2s;
            position: relative;
            cursor: default;
        }
        .custom-link-card:hover { border-color: var(--brand-light); box-shadow: var(--shadow-md); }
        .custom-link-card .link-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--brand-soft);
            color: var(--brand);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            transition: var(--transition);
        }
        .custom-link-card .link-icon .emoji-icon { font-size: 22px; line-height: 1; }
        .custom-link-card .link-info { flex: 1; min-width: 0; }
        .custom-link-card .link-info .link-title { font-weight: 700; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .custom-link-card .link-info .link-url { font-size: 12px; color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .custom-link-card .link-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .custom-link-card .link-actions button {
            background: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            color: var(--text-tertiary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .custom-link-card .link-actions button:hover { background: var(--surface-hover); color: var(--text); }
        .custom-link-card .link-actions button.danger:hover { background: var(--danger-soft); color: var(--danger); }

        .add-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 30px;
            background: var(--border);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            width: 100%;
            justify-content: center;
        }
        .add-link-btn:hover { background: var(--brand-soft); color: var(--brand); }
        .add-link-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .item-list { margin-top: 8px; }
        .item-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            background: var(--surface-hover);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 6px;
        }
        .item-row .item-info { flex: 1; min-width: 0; }
        .item-row .item-info .label { font-weight: 600; font-size: 13px; }
        .item-row .item-info .sub { font-size: 12px; color: var(--text-tertiary); word-break: break-all; }
        .item-row .item-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .item-row .item-actions button {
            background: none;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: var(--transition);
        }
        .item-row .item-actions button:hover { background: var(--border); color: var(--text); }
        .item-row .item-actions button.danger:hover { color: var(--danger); }

        .btn {
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border-radius: 12px;
            padding: 10px 18px;
            font-size: 13px;
        }
        .btn-primary { background: var(--brand); color: #fff; }
        .btn-primary:hover { background: var(--brand-dark); transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
        .btn-ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
        .btn-ghost:hover { background: var(--surface-hover); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-block { width: 100%; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { background: #059669; }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: none;
            flex-shrink: 0;
        }
        .btn.loading .spinner { display: inline-block; }
        .btn.loading .btn-text { opacity: 0.8; }

        .locked-overlay {
            position: relative;
            opacity: 0.6;
            pointer-events: none;
        }
        .locked-overlay::after {
            content: "Upgrade to unlock";
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(2px);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            z-index: 2;
        }
        [data-theme="dark"] .locked-overlay::after { background: rgba(15,23,42,0.7); }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.on { display: flex; }
        .modal-box {
            background: var(--surface);
            border-radius: 24px;
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
            animation: scaleIn 0.25s;
        }
        .modal-head {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .modal-head h3 { font-size: 18px; font-weight: 800; }
        .modal-head .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-secondary); }
        .modal-body { flex: 1; overflow-y: auto; padding: 16px; }
        .modal-search {
            position: relative;
            margin-bottom: 12px;
        }
        .modal-search input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            background: var(--surface);
            color: var(--text);
            outline: none;
        }
        .modal-search input:focus { border-color: var(--brand); }
        .modal-search i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 4px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            cursor: pointer;
            transition: var(--transition);
            gap: 4px;
            aspect-ratio: 1 / 1;
            min-height: 70px;
            position: relative;
        }
        .grid-item:hover { border-color: var(--brand); background: var(--brand-soft); }
        .grid-item.selected { border-color: var(--brand); background: var(--brand-soft); box-shadow: 0 0 0 2px var(--brand-soft); }
        .grid-item.locked {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.6);
        }
        .grid-item.locked .lock-badge {
            position: absolute;
            top: 4px;
            right: 4px;
            background: var(--warning);
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 30px;
        }
        .grid-item i { font-size: 24px; color: var(--text); }
        .grid-item span { font-size: 10px; font-weight: 600; color: var(--text-secondary); text-align: center; line-height: 1.2; }

        .platform-username-input { margin-top: 12px; display: none; }
        .platform-username-input.active { display: block; }

        /* Link preview in modal */
        .link-preview-box {
            background: var(--surface-hover);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
        }
        .link-preview-box .preview-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--brand-soft);
            color: var(--brand);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .link-preview-box .preview-icon .emoji-preview { font-size: 20px; }
        .link-preview-box .preview-text { flex: 1; font-weight: 600; font-size: 14px; color: var(--text); }
        .link-preview-box .preview-url { font-size: 12px; color: var(--text-tertiary); }

        /* Emoji picker */
        .emoji-picker-section {
            margin-top: 12px;
            padding: 12px;
            background: var(--surface-hover);
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .emoji-picker-section .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
            max-height: 160px;
            overflow-y: auto;
        }
        .emoji-picker-section .emoji-item {
            font-size: 24px;
            padding: 6px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            background: var(--surface);
            border: 1px solid transparent;
        }
        .emoji-picker-section .emoji-item:hover { background: var(--brand-soft); border-color: var(--brand); transform: scale(1.1); }
        .emoji-picker-section .emoji-label { font-size: 11px; color: var(--text-tertiary); margin-bottom: 8px; font-weight: 600; }

        /* Loading */
        .loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 16px; color: var(--text-secondary); }
        .loading-state .spinner-lg { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--brand); border-radius: 50%; animation: spin 1s linear infinite; }
        .error-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .error-state i { font-size: 48px; color: var(--text-tertiary); margin-bottom: 16px; display: block; }

        /* ===== LOGO UPLOAD ===== */
        .logo-upload-area {
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            background: var(--surface-hover);
            transition: var(--transition);
            position: relative;
        }
        .logo-upload-area:hover { border-color: var(--brand); background: var(--brand-soft); }
        .logo-upload-area .logo-preview {
            width: 100px;
            height: 100px;
            border-radius: 16px;
            object-fit: cover;
            margin: 0 auto 10px;
            display: block;
            background: var(--surface);
            border: 1px solid var(--border);
        }
        .logo-upload-area .logo-placeholder {
            width: 100px;
            height: 100px;
            border-radius: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 36px;
            color: var(--text-tertiary);
        }
        .logo-upload-area .logo-label { font-size: 13px; font-weight: 600; }
        .logo-upload-area .logo-sub { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
        .logo-upload-area .logo-status { font-size: 12px; font-weight: 600; margin-top: 8px; display: none; }
        .logo-upload-area .logo-status.uploading { display: block; color: var(--brand); }
        .logo-upload-area .logo-status.done { display: block; color: var(--success); }
        .logo-upload-area .logo-status.error { display: block; color: var(--danger); }

        /* Dirty indicator */
        .dirty-indicator {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--warning);
            color: #fff;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: var(--shadow-lg);
            display: none;
            z-index: 50;
            pointer-events: none;
        }
        .dirty-indicator.show { display: block; }

        @keyframes scaleIn { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:scale(1); } }
        @keyframes spin { to { transform:rotate(360deg); } }

        @media(max-width: 640px) {
            .form-row { grid-template-columns: 1fr; }
            .grid-container { grid-template-columns: repeat(3, 1fr); }
            .custom-links-grid { grid-template-columns: 1fr; }
            .emoji-picker-section .emoji-grid { grid-template-columns: repeat(6, 1fr); }
        }

        /* Toast container */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 30px;
            background: var(--text);
            color: var(--surface);
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            animation: slideIn 0.3s ease;
        }
        .toast.success { background: var(--success); color: #fff; }
        .toast.error { background: var(--danger); color: #fff; }
        .toast.warning { background: var(--warning); color: #fff; }
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
<div class="edit-page" id="editApp">
    <!-- Dynamic content -->
</div>

<!-- Dirty indicator -->
<div class="dirty-indicator" id="dirtyIndicator">⚠️ Unsaved changes</div>

<!-- ===== Platform Picker Modal ===== -->
<div id="platformModal" class="modal-overlay" onclick="if(event.target===this) closePlatformModal()">
    <div class="modal-box">
        <div class="modal-head">
            <h3 id="platformModalTitle">Choose Platform</h3>
            <button class="close-btn" onclick="closePlatformModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
            <div class="modal-search"><i class="fa-solid fa-magnifying-glass"></i><input id="platformSearch" placeholder="Search platforms..." oninput="filterPlatforms()" /></div>
            <div id="platformGrid" class="grid-container"></div>
            <div id="platformUsernameInput" class="platform-username-input">
                <div class="form-group">
                    <label id="platformLabel">Username / Handle</label>
                    <input id="platformUsername" class="form-input" placeholder="yourusername" />
                    <div id="platformHint" style="font-size:11px;color:var(--text-tertiary);margin-top:4px;"></div>
                </div>
                <button class="btn btn-primary btn-block" onclick="confirmPlatform()">Add Platform</button>
            </div>
        </div>
    </div>
</div>

<!-- ===== Custom Link Modal ===== -->
<div id="customLinkModal" class="modal-overlay" onclick="if(event.target===this) closeCustomLinkModal()">
    <div class="modal-box">
        <div class="modal-head">
            <h3 id="customLinkModalTitle">Add Custom Link</h3>
            <button class="close-btn" onclick="closeCustomLinkModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Title <span class="required">*</span></label>
                <input id="linkModalTitle" class="form-input" placeholder="e.g. My Portfolio" oninput="updateLinkPreview()" />
            </div>
            <div class="form-group">
                <label>URL <span class="required">*</span></label>
                <input id="linkModalUrl" class="form-input" placeholder="https://example.com" oninput="updateLinkPreview()" />
            </div>
            <div class="form-group">
                <label>Icon</label>
                <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                    <button class="btn btn-ghost btn-sm" onclick="openIconPickerForModal()"><i class="fa-solid fa-icons"></i> Pick Icon</button>
                    <span id="selectedIconDisplay" style="font-size:20px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:8px;">🔗</span>
                    <input type="hidden" id="linkModalIcon" value="link" />
                    <span style="font-size:11px;color:var(--text-tertiary);">Selected icon</span>
                </div>
                <div id="emojiPickerPremium" style="display:none;margin-top:8px;">
                    <div class="emoji-picker-section">
                        <div class="emoji-label">🎨 Pick an emoji (Premium)</div>
                        <div class="emoji-grid" id="emojiGrid"></div>
                    </div>
                </div>
            </div>
            <div class="link-preview-box" id="linkPreviewBox">
                <div class="preview-icon" id="linkPreviewIcon"><i class="fa-solid fa-link"></i></div>
                <div>
                    <div class="preview-text" id="linkPreviewTitle">Link Title</div>
                    <div class="preview-url" id="linkPreviewUrl">https://example.com</div>
                </div>
            </div>
            <button class="btn btn-primary btn-block" id="saveLinkBtn" onclick="saveLinkFromModal()">
                <span class="spinner"></span>
                <span class="btn-text"><i class="fa-solid fa-plus"></i> Add Link</span>
            </button>
        </div>
    </div>
</div>

<!-- ===== Icon Picker Modal ===== -->
<div id="iconPickerModal" class="modal-overlay" onclick="if(event.target===this) closeIconPicker()">
    <div class="modal-box">
        <div class="modal-head">
            <h3>Choose Icon</h3>
            <button class="close-btn" onclick="closeIconPicker()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
            <div class="modal-search"><i class="fa-solid fa-magnifying-glass"></i><input id="iconSearch" placeholder="Search icons..." oninput="filterIcons()" /></div>
            <div id="iconGrid" class="grid-container"></div>
            <div style="margin-top:12px;font-size:11px;color:var(--text-tertiary);text-align:center;">
                <span style="background:var(--warning);color:#fff;padding:2px 6px;border-radius:30px;font-weight:700;">🔒</span> Locked icons require upgrade &nbsp;·&nbsp;
                <span style="background:var(--brand-soft);color:var(--brand);padding:2px 6px;border-radius:30px;font-weight:700;">PRO</span> Pro &nbsp;·&nbsp;
                <span style="background:var(--purple-soft);color:var(--purple);padding:2px 6px;border-radius:30px;font-weight:700;">PREMIUM</span> Premium
            </div>
        </div>
    </div>
</div>

<script>
    // ================================================================
    //  EDIT PAGE — FIXED: flat payload for backend, flat data reading,
    //  no overwriting of socials/custom links on render
    // ================================================================

    (function() {
        'use strict';

        // ================================================================
        //  CONFIG
        // ================================================================
        const API = window.API || 'https://emltechstudio-myshub-api.hf.space';
        const APP_URL = window.APP_URL || 'https://myshub.site';

        // ================================================================
        //  EMOJIS
        // ================================================================
        const COMMON_EMOJIS = [
            '🔥','⭐','❤️','💎','🚀','🌟','💡','🎯','📌','🔗','📱','💻','🖥️','📷','🎨',
            '🛒','📦','📊','📈','📉','📋','📎','📏','🔍','🔎','💬','💭','🗣️','👤','👥',
            '🏆','🥇','🥈','🥉','🎖️','🏅','🎯','🎪','🎨','🎭','🎬','🎤','🎧','🎼','🎹',
            '🚗','🚕','🚙','🚌','🚎','🏎️','🚓','🚑','🚒','🚐','🛻','🚛','🚜','🏍️','🛵'
        ];

        // ================================================================
        //  ICONS BY TIER
        // ================================================================
        const FREE_ICONS = [
            'link','globe','star','heart','arrow-right','check','circle','square',
            'plus','minus','xmark','user','home','search','bell','gear'
        ];
        const PRO_ICONS = [
            ...FREE_ICONS,
            'calendar-check','users','download','circle-play','boxes-stacked','phone',

        // ================================================================

        // ================================================================
        function getSession() {
            if (window.S && window.S.email) {
                return { email: window.S.email, password: window.S.password || '', slug: window.S.slug || '', plan: window.S.plan || 'free' };
            }
            try {
                const raw = localStorage.getItem('myshub_session');
                if (raw) {
                    const s = JSON.parse(raw);
                    if (s.email) return { email: s.email, password: s.password || '', slug: s.slug || '', plan: s.plan || 'free' };
                }
            } catch (e) {}
            return null;
        }

        function navigate(page) {
            if (dirty && !confirm('You have unsaved changes. Are you sure you want to leave?')) return;
            resetDirty();
            if (typeof window.loadPage === 'function') window.loadPage(page);
            else window.location.href = '/' + page + '.html';
        }

        // ================================================================
        //  FETCH SHOP DATA (from /shop/preview) — returns flat structure
        // ================================================================
        async function fetchShopData(session) {
            if (!session || !session.slug) return null;
            try {
                const headers = { 'Content-Type': 'application/json', 'email': session.email, 'password': session.password };
                const res = await fetch(API + '/shop/preview/' + session.slug, { headers });
                if (!res.ok) return null;
                return await res.json();
            } catch (e) { return null; }
        }

        // ================================================================
        //  SAVE SHOP — sends flat fields as EditShopRequest expects
        // ================================================================
        async function saveShop(formData) {
            const session = getSession();
            if (!session) throw new Error('Not logged in');

            const payload = {
                email: session.email,
                password: session.password,
                business_name: formData.business_name || null,
                tagline: formData.tagline || null,
                description: formData.description || null,
                phone: formData.phone || null,
                location: formData.location || null,
                state: formData.state || null,
                city: formData.city || null,
                category: formData.category || null,
                logo_url: formData.logo_url || null,
                catalog_url: formData.catalog_url || null,
                socials: formData.socials || {},
                custom_links: formData.custom_links || [],
                brand_primary: formData.brand_primary || null,
                brand_secondary: formData.brand_secondary || null,
                gradient: formData.gradient,
                gradient_colors: formData.gradient_colors || null,
                heading_font: formData.heading_font || null,
                body_font: formData.body_font || null,
                latitude: formData.latitude !== undefined ? formData.latitude : null,
                longitude: formData.longitude !== undefined ? formData.longitude : null,
                qr_code_url: null
            };

            const headers = { 'Content-Type': 'application/json', 'email': session.email, 'password': session.password };
            const res = await fetch(API + '/shop/edit/' + session.slug, {
                method: 'PUT',
                headers: headers,
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                const err = await res.text();
                throw new Error(err || 'Failed to save shop');
            }
            return await res.json();
        }

        // ================================================================
        //  UPLOAD LOGO
        // ================================================================
        async function uploadLogo(file) {
            const session = getSession();
            if (!session) throw new Error('Not logged in');

            const formData = new FormData();
            formData.append('file', file);

            const headers = { 'email': session.email, 'password': session.password };
            const res = await fetch(API + '/shop/upload-logo', {
                method: 'POST',
                headers: headers,
                body: formData
            });

            if (!res.ok) {
                const err = await res.text();
                throw new Error(err || 'Failed to upload logo');
            }
            return await res.json();
        }

        // Simple toast system (no dependency)
        window.toast = function(message, type = 'info') {
            let container = document.querySelector('.toast-container');
            if (!container) {
                container = document.createElement('div');
                container.className = 'toast-container';
                document.body.appendChild(container);
            }
            const toastEl = document.createElement('div');
            toastEl.className = `toast ${type}`;
            toastEl.textContent = message;
            container.appendChild(toastEl);
            setTimeout(() => toastEl.remove(), 3000);
        };

        // ================================================================
        //  ESCAPE HTML
        // ================================================================
        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        // ================================================================

        function getCategoryOptions(selected) {
            const isCustom = selected && !CATEGORIES.includes(selected);
            const selectedCat = isCustom ? 'Other' : (selected || '');
            return CATEGORIES.map(c => `<option value="${c}" ${c === selectedCat ? 'selected' : ''}>${c}</option>`).join('');
        }

        function getFontOptions(selected) {
            const fonts = ['Inter', 'Poppins', 'Playfair Display', 'Open Sans', 'DM Sans', 'Space Grotesk',
                'Montserrat', 'Lato', 'Oswald', 'Raleway', 'Roboto', 'Nunito', 'Outfit', 'Sora', 'Manrope'
            ];
            return fonts.map(f => `<option value="${f}" ${f === selected ? 'selected' : ''}>${f}</option>`).join('');
        }

                        <div class="link-icon">${iconContent}</div>
                        <div class="link-info">

                toast(`Limit reached (${limit}). Upgrade to add more.`, 'warning');

            setDirty();
            openPlatformModal((platform, url) => {
                socials[platform] = url;
                renderEdit();
            });
        }

        function editSocial(platform) {
            setDirty();
            openPlatformModal((p, url) => {
                const newPlatform = p;
                if (newPlatform !== platform) {
                    delete socials[platform];
                }
                socials[newPlatform] = url;
                renderEdit();
            });
        }

        function removeSocial(platform) {
            if (!confirm(`Remove ${platform}?`)) return;
            setDirty();
            delete socials[platform];
            renderEdit();

                return;
            }
            if (!url) {
                toast('Please enter a URL.', 'warning');
                return;
            }

            const linkData = {
                title: title,
                label: title,  // BOTH title AND label for shop compatibility
                url: url,
                icon: linkModalIcon,
                isEmoji: linkModalIsEmoji
            };

            if (linkModalEditingIndex >= 0) {
                customLinks[linkModalEditingIndex] = linkData;
            } else {
                customLinks.push(linkData);
            }

            setDirty();
            closeCustomLinkModal();
            renderEdit();
        }

                return `
                    <div class="grid-item ${item.locked ? 'locked' : ''}" 
                         onclick="${item.locked ? '' : `selectIconFromPicker('${item.name}')`}"
                         title="${item.locked ? '🔒 Upgrade to ' + tierLabel : tierLabel}">
                        <i class="fa-solid fa-${item.name}"></i>
                        <span>${item.name}</span>
                        ${item.locked ? '<span class="lock-badge">🔒</span>' : ''}
                        ${!item.locked ? `<span style="font-size:7px;color:var(--text-tertiary);">${tierLabel}</span>` : ''}
                    </div>
                `;
            }).join('');
        }

        function selectIconFromPicker(icon) {
            linkModalIcon = icon;
            linkModalIsEmoji = false;
            closeIconPicker();
            updateLinkPreview();
        }

        // ================================================================
        //  LOGO UPLOAD
        // ================================================================
        async function handleLogoSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 2 * 1024 * 1024) {
                toast('Logo must be under 2MB.', 'error');
                return;
            }
            const statusEl = document.getElementById('logoStatus');
            if (statusEl) {
                statusEl.className = 'logo-status uploading';
                statusEl.textContent = '⏳ Uploading...';
            }
            setDirty();
            try {
                const result = await uploadLogo(file);
                if (result.logo_url) {
                    tempLogoUrl = result.logo_url;
                    if (statusEl) {
                        statusEl.className = 'logo-status done';
                        statusEl.textContent = '✅ Logo uploaded!';
                    }
                    toast('Logo uploaded!', 'success');
                    renderEdit();
                } else {
                    if (statusEl) {
                        statusEl.className = 'logo-status error';
                        statusEl.textContent = '❌ Upload failed.';
                    }
                    toast('Upload failed.', 'error');
                }
            } catch (e) {
                if (statusEl) {
                    statusEl.className = 'logo-status error';
                    statusEl.textContent = '❌ ' + (e.message || 'Upload error.');
                }
                toast(e.message || 'Upload error.', 'error');
            }
            event.target.value = '';
        }

        // ================================================================
        //  USE MY LOCATION
        // ================================================================
        function useMyLocation() {
            if (!navigator.geolocation) {
                toast('Geolocation not supported.', 'warning');
                return;
            }
            setDirty();
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    document.getElementById('editLat').value = pos.coords.latitude;
                    document.getElementById('editLng').value = pos.coords.longitude;
                    toast('Location set!', 'success');
                },
                () => {
                    toast('Could not get location. Please enter manually.', 'warning');
                }
            );
        }

        // ================================================================
        //  SAVE
        // ================================================================
        async function saveEdit() {
            if (isSaving) return;
            const btn = document.getElementById('saveBtn');
            if (!btn) return;
            btn.disabled = true;
            btn.classList.add('loading');

            const btnText = btn.querySelector('.btn-text');
            if (btnText) btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

            try {
                const catSelect = document.getElementById('editCategory');
                const catValue = catSelect.value;
                let category = catValue;
                if (catValue === 'Other') {
                    const customCat = document.getElementById('editCategoryOther').value.trim();
                    if (!customCat) {
                        toast('Please specify your category.', 'warning');
                        btn.disabled = false;
                        btn.classList.remove('loading');
                        if (btnText) btnText.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Changes';
                        return;
                    }
                    category = customCat;
                }

                const formData = {
                    business_name: document.getElementById('editBusinessName').value.trim(),
                    tagline: document.getElementById('editTagline').value.trim(),
                    description: document.getElementById('editDescription').value.trim(),
                    phone: document.getElementById('editPhone').value.trim(),
                    location: document.getElementById('editLocation').value.trim(),
                    state: document.getElementById('editState').value.trim(),
                    city: document.getElementById('editCity').value.trim(),
                    category: category,
                    catalog_url: document.getElementById('editCatalog').value.trim(),
                    socials: socials,
                    custom_links: customLinks,
                    brand_primary: document.getElementById('editPrimary').value,
                    brand_secondary: document.getElementById('editSecondary').value,
                    gradient: document.getElementById('editGradient').checked,
                    gradient_colors: [
                        document.getElementById('editGrad1').value,
                        document.getElementById('editGrad2').value
                    ],
                    heading_font: document.getElementById('editHeadingFont').value,
                    body_font: document.getElementById('editBodyFont').value,
                    latitude: parseFloat(document.getElementById('editLat').value) || undefined,
                    longitude: parseFloat(document.getElementById('editLng').value) || undefined,
                    logo_url: tempLogoUrl || null
                };

                const result = await saveShop(formData);
                toast(result.message || 'Shop updated successfully!', 'success');
                resetDirty();

                if (btnText) btnText.innerHTML = '<i class="fa-solid fa-check"></i> Saved!';
                setTimeout(() => {
                    if (btnText) btnText.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Changes';
                }, 2000);

                // Refresh data from server
                const session = getSession();
                if (session) {
                    const data = await fetchShopData(session);
                    if (data) {
                        shopData = data;
                        shopJson = data.shop_json || {};
                        currentPlan = data.plan || session.plan || 'free';
                        // Update working copies ONLY after successful refetch
                        socials = { ...(shopJson.socials || {}) };
                        if (shopJson.custom_links) {
                            customLinks = shopJson.custom_links.map(l => ({
                                ...l,
                                label: l.label || l.title || 'Untitled',
                                title: l.title || l.label || 'Untitled'
                            }));
                        } else {
                            customLinks = [];
                        }
                        tempLogoUrl = shopJson.logo_url || '';
                    }
                }
                renderEdit();
            } catch (e) {
                toast(e.message || 'Failed to save. Please try again.', 'error');
                if (btnText) btnText.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Changes';
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        }

        // ================================================================
        //  RENDER — reads FLAT shop_json from /shop/preview
        // ================================================================
        function renderEdit() {
            if (isRendering) return;
            isRendering = true;
            try {
                _renderEditImpl();
            } finally {
                isRendering = false;
            }
        }

        function _renderEditImpl() {
            const app = document.getElementById('editApp');
            if (!app) return;

            if (isLoading) {
                app.innerHTML = `
                    <div class="loading-state">
                        <div class="spinner-lg"></div>
                        <span>Loading shop data...</span>
                    </div>
                `;
                return;
            }

            if (loadError) {
                app.innerHTML = `
                    <div class="error-state">
                        <i class="fa-regular fa-circle-exclamation"></i>
                        <div style="font-weight:600;margin-bottom:8px;">Could not load shop</div>
                        <p style="font-size:13px;color:var(--text-secondary);">${loadError}</p>
                        <button class="btn btn-primary btn-sm" style="margin-top:16px;" onclick="location.reload()">Try Again</button>
                    </div>
                `;
                return;
            }

            if (!shopJson) {
                app.innerHTML = `
                    <div class="error-state">
                        <i class="fa-regular fa-store"></i>
                        <div style="font-weight:600;margin-bottom:8px;">No shop data found</div>
                        <p style="font-size:13px;color:var(--text-secondary);">Please create your shop first.</p>
                    </div>
                `;
                return;
            }

            const sj = shopJson;
            const plan = currentPlan || 'free';
            const isPro = plan === 'pro' || plan === 'premium';
            const isPremium = plan === 'premium';

            // Flat fields: phone, location, catalog_url, lat, lng are top-level
            // Brand colors and typography remain nested objects
            const brandColors = sj.brand_colors || {};
            const typography = sj.typography || {};

            const socialCount = Object.keys(socials).length;
            const linkCount = customLinks.length;
            const socialsLimit = isPremium ? 999 : (isPro ? 10 : 5);
            const linksLimit = isPremium ? 999 : (isPro ? 5 : 2);
            const socialsExceeded = socialCount >= socialsLimit;
            const linksExceeded = linkCount >= linksLimit;

            const isCategoryOther = sj.category && !CATEGORIES.includes(sj.category);
            const categoryValue = isCategoryOther ? 'Other' : (sj.category || '');
            const customCategoryValue = isCategoryOther ? sj.category : '';

            const primaryColor = brandColors.primary || '#1e40af';
            const secondaryColor = brandColors.secondary || '#ffffff';
            const grad1 = brandColors.gradient_colors?.[0] || '#1e40af';
            const grad2 = brandColors.gradient_colors?.[1] || '#3b82f6';

            let html = '';

            html += `
                <div class="page-header">
                    <h2>Edit Shop</h2>
                    <div class="sub">Update your business information.</div>
                </div>
            `;

            // ---- Basic Info ----
            html += `
                <div class="card">
                    <div class="card-title">Basic Information</div>
                    <div class="form-group">
                        <label>Business Name <span class="required">*</span></label>
                        <input type="text" id="editBusinessName" class="form-input" value="${escapeHtml(sj.business_name || '')}" placeholder="My Business" oninput="markDirty()" />
                    </div>
                    <div class="form-group">
                        <label>Tagline</label>
                        <input type="text" id="editTagline" class="form-input" value="${escapeHtml(sj.tagline || '')}" placeholder="A short catchy phrase" oninput="markDirty()" />
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="editDescription" class="form-input" rows="3" placeholder="Tell customers about your business" oninput="markDirty()">${escapeHtml(sj.description || '')}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="editCategory" class="form-input" onchange="toggleCategoryOther(); markDirty();">
                            ${getCategoryOptions(categoryValue)}
                        </select>
                    </div>
                    <div class="form-group" id="categoryOtherGroup" style="${isCategoryOther || categoryValue === 'Other' ? 'display:block;' : 'display:none;'}">
                        <label>Specify Category</label>
                        <input type="text" id="editCategoryOther" class="form-input" value="${escapeHtml(customCategoryValue)}" placeholder="e.g. Handmade Crafts" oninput="markDirty()" />
                    </div>
                </div>
            `;

            // ---- Contact & Location (flat phone/location, no country) ----
            html += `
                <div class="card">
                    <div class="card-title">Contact & Location</div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" id="editPhone" class="form-input" value="${escapeHtml(sj.phone || '')}" placeholder="+234..." oninput="markDirty()" />
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>State / Region</label>
                            <input type="text" id="editState" class="form-input" value="${escapeHtml(sj.state || '')}" placeholder="e.g. Lagos" oninput="markDirty()" />
                        </div>
                        <div class="form-group">
                            <label>City</label>
                            <input type="text" id="editCity" class="form-input" value="${escapeHtml(sj.city || '')}" placeholder="e.g. Ikeja" oninput="markDirty()" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Location (Address)</label>
                        <input type="text" id="editLocation" class="form-input" value="${escapeHtml(sj.location || '')}" placeholder="Full address or area" oninput="markDirty()" />
                        <div style="font-size:11px;color:var(--text-tertiary);margin-top:4px;">Your country is automatically detected from your IP address.</div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Latitude</label>
                            <input type="number" step="any" id="editLat" class="form-input" value="${sj.lat !== undefined && sj.lat !== null ? sj.lat : ''}" placeholder="6.4281" oninput="markDirty()" />
                        </div>
                        <div class="form-group">
                            <label>Longitude</label>
                            <input type="number" step="any" id="editLng" class="form-input" value="${sj.lng !== undefined && sj.lng !== null ? sj.lng : ''}" placeholder="3.4447" oninput="markDirty()" />
                        </div>
                    </div>
                    <button class="btn btn-ghost btn-sm" onclick="useMyLocation()"><i class="fa-solid fa-location-crosshairs"></i> Use my location</button>
                </div>
            `;

            // ---- Catalog ----
            html += `
                <div class="card">
                    <div class="card-title">Catalog</div>
                    <div class="form-group">
                        <label>Catalog URL</label>
                        <input type="url" id="editCatalog" class="form-input" value="${escapeHtml(sj.catalog_url || '')}" placeholder="https://selar.co/your-store" oninput="markDirty()" />
                        <div style="font-size:11px;color:var(--text-tertiary);margin-top:4px;">Your online store, WhatsApp catalog, or any product link.</div>
                    </div>
                </div>
            `;

            // ---- Socials ----
            html += `
                <div class="card">
                    <div class="card-title">
                        Socials
                        <span class="badge">${socialCount} / ${socialsLimit === 999 ? '∞' : socialsLimit}</span>
                    </div>
                    <div id="socialsList" class="item-list">
                        ${renderSocialsList()}
                    </div>
                    <button class="add-link-btn" onclick="addSocial()" ${socialsExceeded ? 'disabled' : ''}>
                        <i class="fa-solid fa-plus"></i> Add Social
                    </button>
                    ${socialsExceeded && !isPremium ? `<div style="font-size:11px;color:var(--warning);margin-top:6px;">Upgrade to add more socials.</div>` : ''}
                </div>
            `;

            // ---- Custom Links ----
            html += `
                <div class="card">
                    <div class="card-title">
                        Custom Links
                        <span class="badge">${linkCount} / ${linksLimit === 999 ? '∞' : linksLimit}</span>
                    </div>
                    <div id="customLinksList" class="custom-links-grid">
                        ${renderCustomLinksCards()}
                    </div>
                    <button class="add-link-btn" onclick="addCustomLink()" ${linksExceeded ? 'disabled' : ''}>
                        <i class="fa-solid fa-plus"></i> Add Custom Link
                    </button>
                    ${linksExceeded && !isPremium ? `<div style="font-size:11px;color:var(--warning);margin-top:6px;">Upgrade to add more custom links.</div>` : ''}
                </div>
            `;

            // ---- Branding ----
            html += `
                <div class="card">
                    <div class="card-title">
                        Branding
                        <span class="badge ${isPro ? 'pro' : ''}">${isPremium ? 'Premium' : isPro ? 'Pro' : 'Free'}</span>
                    </div>
                    <div class="form-group ${!isPro ? 'locked-overlay' : ''}">
                        <label>Primary Color</label>
                        <div class="color-row">
                            <input type="color" id="editPrimary" class="color-input" value="${primaryColor}" ${!isPro ? 'disabled' : ''} oninput="markDirty()" />
                            <input type="text" class="form-input" value="${primaryColor}" oninput="document.getElementById('editPrimary').value=this.value;markDirty();" ${!isPro ? 'disabled' : ''} />
                        </div>
                    </div>
                    <div class="form-group ${!isPro ? 'locked-overlay' : ''}">
                        <label>Secondary Color</label>
                        <div class="color-row">
                            <input type="color" id="editSecondary" class="color-input" value="${secondaryColor}" ${!isPro ? 'disabled' : ''} oninput="markDirty()" />
                            <input type="text" class="form-input" value="${secondaryColor}" oninput="document.getElementById('editSecondary').value=this.value;markDirty();" ${!isPro ? 'disabled' : ''} />
                        </div>
                    </div>
                    <div class="form-group ${!isPremium ? 'locked-overlay' : ''}">
                        <label>Enable Gradient</label>
                        <input type="checkbox" id="editGradient" ${brandColors.gradient ? 'checked' : ''} ${!isPremium ? 'disabled' : ''} onchange="markDirty()" />
                        <div style="font-size:11px;color:var(--text-tertiary);margin-top:4px;">Gradients overlay the secondary color.</div>
                    </div>
                    <div class="form-row ${!isPremium ? 'locked-overlay' : ''}">
                        <div class="form-group">
                            <label>Gradient Color 1</label>
                            <input type="color" id="editGrad1" class="color-input" value="${grad1}" ${!isPremium ? 'disabled' : ''} oninput="markDirty()" />
                        </div>
                        <div class="form-group">
                            <label>Gradient Color 2</label>
                            <input type="color" id="editGrad2" class="color-input" value="${grad2}" ${!isPremium ? 'disabled' : ''} oninput="markDirty()" />
                        </div>
                    </div>
                    <div class="form-group ${!isPro ? 'locked-overlay' : ''}">
                        <label>Heading Font</label>
                        <select id="editHeadingFont" class="form-input" ${!isPro ? 'disabled' : ''} onchange="markDirty()">
                            ${getFontOptions(typography.heading_font || 'Inter')}
                        </select>
                    </div>
                    <div class="form-group ${!isPro ? 'locked-overlay' : ''}">
                        <label>Body Font</label>
                        <select id="editBodyFont" class="form-input" ${!isPro ? 'disabled' : ''} onchange="markDirty()">
                            ${getFontOptions(typography.body_font || 'Inter')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Logo</label>
                        <div class="logo-upload-area" onclick="document.getElementById('logoFileInput').click()">
                            ${sj.logo_url || tempLogoUrl ? `<img src="${sj.logo_url || tempLogoUrl}" class="logo-preview" alt="Logo" />` : `<div class="logo-placeholder">📷</div>`}
                            <div class="logo-label">${sj.logo_url || tempLogoUrl ? 'Click to change logo' : 'Click to upload logo'}</div>
                            <div class="logo-sub">PNG/JPG max 2MB</div>
                            <div id="logoStatus" class="logo-status"></div>
                        </div>
                        <input id="logoFileInput" type="file" accept="image/*" style="display:none" onchange="handleLogoSelect(event)" />
                    </div>
                </div>
            `;

            // ---- Save Button ----
            html += `
                <button id="saveBtn" class="btn btn-primary btn-block" onclick="saveEdit()">
                    <span class="spinner"></span>
                    <span class="btn-text"><i class="fa-solid fa-floppy-disk"></i> Save Changes</span>
                </button>
            `;

            app.innerHTML = html;

            toggleCategoryOther();

            // Update dirty indicator
            const dirtyEl = document.getElementById('dirtyIndicator');
            if (dirtyEl) {
                dirtyEl.classList.toggle('show', dirty);
            }
        }

        // ================================================================
        //  CATEGORY TOGGLE
        // ================================================================
        function toggleCategoryOther() {
            const sel = document.getElementById('editCategory');
            const group = document.getElementById('categoryOtherGroup');
            if (sel && group) {
                group.style.display = sel.value === 'Other' ? 'block' : 'none';
            }
        }

        // ================================================================
        //  QR ACTIONS (kept but not shown)
        // ================================================================
        async function generateQR() {
            toast('QR generation is only available from the shop preview.', 'info');
        }

        function downloadQr() {
            toast('QR download is only available from the shop preview.', 'info');
        }

        // ================================================================
        //  INIT
        // ================================================================
        async function init() {
            try {
                const session = getSession();
                if (!session) {
                    isLoading = false;
                    renderEdit();
                    return;
                }

                if (!window.S) window.S = {};
                window.S.email = session.email;
                window.S.password = session.password;
                window.S.slug = session.slug;
                window.S.plan = session.plan;

                const data = await fetchShopData(session);
                if (data) {
                    shopData = data;
                    shopJson = data.shop_json || {};
                    currentPlan = data.plan || session.plan || 'free';
                    window.S.plan = currentPlan;
                    window.S.shopJson = shopJson;
                    window.S.shopData = data;
                    // Initialize working copies ONLY once
                    socials = { ...(shopJson.socials || {}) };
                    if (shopJson.custom_links) {
                        customLinks = shopJson.custom_links.map(l => ({
                            ...l,
                            label: l.label || l.title || 'Untitled',
                            title: l.title || l.label || 'Untitled'
                        }));
                    } else {
                        customLinks = [];
                    }
                    tempLogoUrl = shopJson.logo_url || '';
                } else {
                    shopJson = {};
                    socials = {};
                    customLinks = [];
                    currentPlan = session.plan || 'free';
                }

                isLoading = false;
                renderEdit();
            } catch (error) {
                console.error('Edit init error:', error);
                loadError = error.message || 'Failed to load edit page.';
                isLoading = false;
                renderEdit();
            }
        }

        // ================================================================
        //  EXPOSE GLOBALS
        // ================================================================
        window.addSocial = addSocial;
        window.editSocial = editSocial;
        window.removeSocial = removeSocial;
        window.addCustomLink = addCustomLink;
        window.editCustomLink = editCustomLink;
        window.removeCustomLink = removeCustomLink;
        window.handleLogoSelect = handleLogoSelect;
        window.useMyLocation = useMyLocation;
        window.saveEdit = saveEdit;
        window.generateQR = generateQR;
        window.downloadQr = downloadQr;
        window.toggleCategoryOther = toggleCategoryOther;
        window.markDirty = function() { setDirty(); };  // for inline oninput/onchange
        window.setDirty = setDirty;
        window.resetDirty = resetDirty;
        window.toast = toast;
        window.navigate = navigate;

        window.closePlatformModal = closePlatformModal;
        window.filterPlatforms = filterPlatforms;
        window.selectPlatform = selectPlatform;
        window.confirmPlatform = confirmPlatform;
        window.closeCustomLinkModal = closeCustomLinkModal;
        window.saveLinkFromModal = saveLinkFromModal;
        window.selectEmoji = selectEmoji;
        window.closeIconPicker = closeIconPicker;
        window.filterIcons = filterIcons;
        window.selectIconFromPicker = selectIconFromPicker;
        window.openIconPickerForModal = openIconPickerForModal;
        window.updateLinkPreview = updateLinkPreview;

        init();
    })();
</script>
</body>
</html>
