:root{
  --bg:#f1f5f9;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --surface-3:#eef2ff;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;
  --brand:#2563eb;
  --brand-2:#1d4ed8;
  --green:#16a34a;
  --amber:#d97706;
  --red:#dc2626;
  --purple:#7c3aed;
  --cyan:#0891b2;
  --shadow:0 10px 30px rgba(15,23,42,.08);
}

[data-theme="dark"]{
  --bg:#0b1220;
  --surface:#111a2e;
  --surface-2:#16203a;
  --surface-3:#1a2a52;
  --text:#eef2ff;
  --muted:#94a3b8;
  --border:#243349;
  --brand:#3b82f6;
  --brand-2:#60a5fa;
  --green:#22c55e;
  --amber:#f59e0b;
  --red:#f87171;
  --purple:#a78bfa;
  --cyan:#22d3ee;
  --shadow:0 12px 32px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box
}

html,body,#root{
  margin:0;
  min-height:100%
}

body{
  font-family:"IBM Plex Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text)
}

.mono{
  font-family:"IBM Plex Mono",ui-monospace,monospace
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

input,select,textarea{
  color:var(--text);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 12px;
  outline:none;
  width:100%
}

input:focus,select:focus,textarea:focus{
  border-color:var(--brand);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow)
}

.chip{
  border:1px solid var(--border);
  background:var(--surface-2);
  border-radius:999px;
  padding:5px 10px;
  font-size:12px;
  font-weight:600
}

.navbtn{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:11px 12px;
  border-radius:11px;
  font-weight:600;
  font-size:14px
}

.navbtn.active{
  background:var(--brand);
  color:#fff;
  box-shadow:0 6px 18px rgba(37,99,235,.28)
}

.navbtn:hover:not(.active){
  background:var(--surface-2);
  color:var(--text)
}

.btn{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  font-weight:700;
  font-size:13px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px
}

.btn-primary{
  background:var(--brand);
  color:#fff
}

.btn-primary:hover{
  background:var(--brand-2)
}

.btn-ghost{
  background:var(--surface-2);
  color:var(--text);
  border:1px solid var(--border)
}

.btn-danger{
  background:#fee2e2;
  color:#991b1b
}

.btn-dark{
  background:#0f172a;
  color:#fff
}

[data-theme="dark"] .btn-dark{
  background:#e2e8f0;
  color:#0f172a
}

.period{
  border:1px solid var(--border);
  background:var(--surface-2);
  border-radius:9px;
  padding:7px 10px;
  font-size:12px;
  font-weight:700;
  color:var(--muted)
}

.period.active{
  background:var(--brand);
  color:#fff;
  border-color:var(--brand)
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px
}

th{
  text-align:left;
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.07em;
  padding:11px 12px;
  border-bottom:1px solid var(--border)
}

td{
  padding:12px;
  border-bottom:1px solid var(--border);
  vertical-align:top
}

::-webkit-scrollbar{
  height:8px;
  width:8px
}

::-webkit-scrollbar-thumb{
  background:#cbd5e1;
  border-radius:99px
}

[data-theme="dark"] ::-webkit-scrollbar-thumb{
  background:#334155
}

.recharts-wrapper,.recharts-surface{
  outline:none
}

@media(max-width:640px){
  td,th{
    padding:10px 8px
  }
}
</style>
