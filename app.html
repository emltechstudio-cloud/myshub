<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <meta name="theme-color" content="#0f172a">
  <title>Admin · MyShub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #818cf8;
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-light: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 14px;
      --shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; }
    ::-webkit-scrollbar { width:4px; height:4px; }
    ::-webkit-scrollbar-track { background:var(--bg); }
    ::-webkit-scrollbar-thumb { background:var(--surface-light); border-radius:4px; }

    /* Sidebar */
    .sidebar { width:250px; background:var(--surface); border-right:1px solid var(--border); padding:20px 14px; display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; overflow-y:auto; z-index:50; transition:transform 0.3s ease; }
    .sidebar .brand { display:flex; align-items:center; gap:10px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.15rem; padding-bottom:20px; border-bottom:1px solid var(--border); margin-bottom:16px; }
    .sidebar .brand img { width:30px; height:30px; border-radius:8px; }
    .sidebar .nav-item { display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:10px; color:var(--text-muted); font-weight:500; font-size:0.9rem; cursor:pointer; transition:all 0.2s; margin-bottom:2px; }
    .sidebar .nav-item i { width:20px; text-align:center; font-size:1rem; }
    .sidebar .nav-item:hover { background:var(--surface-light); color:var(--text); }
    .sidebar .nav-item.active { background:var(--primary); color:white; box-shadow:0 4px 12px rgba(99,102,241,0.3); }
    .sidebar .nav-item .badge { margin-left:auto; background:var(--primary); color:white; padding:0 8px; border-radius:20px; font-size:0.65rem; font-weight:600; }
    .sidebar .nav-item.active .badge { background:rgba(255,255,255,0.2); }
    .sidebar .spacer { flex:1; }
    .sidebar .footer-item { border-top:1px solid var(--border); padding-top:14px; margin-top:8px; }

    /* Main */
    .main { margin-left:250px; flex:1; padding:20px 32px 40px; min-height:100vh; }
    @media (max-width:768px) {
      .sidebar { transform:translateX(-100%); width:280px; }
      .sidebar.open { transform:translateX(0); }
      .main { margin-left:0; padding:16px 12px 32px; padding-top:60px; }
      .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:40; }
      .overlay.active { display:block; }
      .mobile-toggle { display:flex !important; }
    }
    .mobile-toggle { display:none; position:fixed; top:12px; left:12px; z-index:45; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:10px; cursor:pointer; font-size:1.1rem; align-items:center; gap:8px; }

    /* Cards */
    .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; transition:transform 0.2s, box-shadow 0.2s; }
    .card:hover { box-shadow:var(--shadow); }

    /* Tables */
    .table-wrap { overflow-x:auto; }
    .table-header { display:grid; gap:12px; padding:10px 14px; border-bottom:1px solid var(--border); font-weight:600; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted); background:rgba(0,0,0,0.15); border-radius:var(--radius) var(--radius) 0 0; }
    .table-row { display:grid; gap:12px; padding:10px 14px; border-bottom:1px solid var(--border); align-items:center; font-size:0.85rem; transition:background 0.15s; }
    .table-row:hover { background:rgba(99,102,241,0.04); }
    .table-row:last-child { border-bottom:none; }

    /* Stats */
    .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 18px; }
    .stat-card .value { font-size:1.6rem; font-weight:800; margin-bottom:2px; }
    .stat-card .label { font-size:0.7rem; font-weight:500; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.04em; }

    /* Buttons */
    .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 18px; border-radius:10px; font-weight:600; font-size:0.85rem; border:none; cursor:pointer; transition:all 0.2s; font-family:inherit; }
    .btn-primary { background:var(--primary); color:white; }
    .btn-primary:hover { background:var(--primary-dark); transform:translateY(-1px); }
    .btn-danger { background:var(--danger); color:white; }
    .btn-danger:hover { background:#dc2626; }
    .btn-success { background:var(--success); color:white; }
    .btn-success:hover { background:#16a34a; }
    .btn-ghost { background:var(--surface-light); color:var(--text); border:1px solid var(--border); }
    .btn-ghost:hover { background:var(--border); }
    .btn-sm { padding:5px 12px; font-size:0.75rem; }
    .btn-xs { padding:3px 10px; font-size:0.7rem; border-radius:6px; }
    .btn-icon { width:32px; height:32px; padding:0; border-radius:8px; display:flex; align-items:center; justify-content:center; }

    /* Inputs */
    .input { width:100%; padding:9px 14px; background:var(--bg); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:0.9rem; font-family:inherit; transition:border 0.2s, box-shadow 0.2s; outline:none; }
    .input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(99,102,241,0.15); }
    .input::placeholder { color:var(--text-muted); }

    /* Badges */
    .badge-plan { padding:2px 10px; border-radius:20px; font-size:0.65rem; font-weight:600; text-transform:capitalize; }
    .badge-free { background:rgba(148,163,184,0.15); color:#94a3b8; }
    .badge-pro { background:rgba(99,102,241,0.15); color:#818cf8; }
    .badge-premium { background:rgba(251,191,36,0.15); color:#fbbf24; }
    .badge-status { padding:2px 10px; border-radius:20px; font-size:0.6rem; font-weight:600; text-transform:capitalize; }
    .badge-active { background:rgba(34,197,94,0.12); color:#4ade80; }
    .badge-inactive { background:rgba(239,68,68,0.12); color:#f87171; }

    /* Modal */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); z-index:100; align-items:center; justify-content:center; padding:20px; }
    .modal-overlay.active { display:flex; }
    .modal { background:var(--surface); border:1px solid var(--border); border-radius:20px; max-width:600px; width:100%; max-height:90vh; overflow-y:auto; padding:24px 28px; box-shadow:var(--shadow); animation:fadeIn 0.2s ease; }
    .modal .close { float:right; background:none; border:none; color:var(--text-muted); font-size:1.2rem; cursor:pointer; padding:4px 8px; border-radius:6px; }
    .modal .close:hover { background:var(--surface-light); color:var(--text); }
    .modal h2 { font-size:1.2rem; font-weight:700; margin-bottom:16px; }

    /* Toast */
    .toast-container { position:fixed; top:80px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; pointer-events:none; max-width:90%; }
    .toast { padding:10px 18px; border-radius:10px; font-weight:500; font-size:0.85rem; display:flex; align-items:center; gap:8px; animation:slideDown 0.3s ease; pointer-events:auto; }
    .toast-success { background:rgba(34,197,94,0.12); color:#4ade80; border:1px solid rgba(34,197,94,0.2); }
    .toast-error { background:rgba(239,68,68,0.12); color:#f87171; border:1px solid rgba(239,68,68,0.2); }
    .toast-info { background:rgba(99,102,241,0.12); color:#818cf8; border:1px solid rgba(99,102,241,0.2); }

    @keyframes slideDown { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeIn { from { opacity:0; transform:scale(0.96); } to { opacity:1; transform:scale(1); } }

    /* Grid helpers */
    .grid-cols-2 { grid-template-columns:1fr 1fr; }
    .grid-cols-4 { grid-template-columns:repeat(4,1fr); }
    .grid-cols-6 { grid-template-columns:repeat(6,1fr); }

    @media (max-width:640px) {
      .grid-cols-2, .grid-cols-4 { grid-template-columns:1fr 1fr; }
      .stats-grid .stat-card .value { font-size:1.2rem; }
      .table-header, .table-row { grid-template-columns:1fr 1fr; gap:6px; padding:8px 10px; font-size:0.8rem; }
      .table-header > *:nth-child(3), .table-row > *:nth-child(3),
      .table-header > *:nth-child(4), .table-row > *:nth-child(4) { display:none; }
    }
    @media (max-width:400px) {
      .grid-cols-2, .grid-cols-4 { grid-template-columns:1fr; }
    }

    /* Loading pulse */
    .loading-pulse { animation:pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

    .text-muted { color:var(--text-muted); }
    .border-surface { border-color:var(--border); }
    .bg-surface { background:var(--surface); }
    .bg-surface-light { background:var(--surface-light); }

    /* Scrollable table container */
    .table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  </style>
</head>
<body>

  <!-- Mobile overlay -->
  <div class="overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- Mobile toggle -->
  <button class="mobile-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i> Menu</button>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="/icon.svg" alt="MyShub" />
      <span>MyShub</span>
    </div>
    <nav>
      <div class="nav-item active" data-tab="dashboard" onclick="switchTab('dashboard')">
        <i class="fas fa-gauge-high"></i> Dashboard
      </div>
      <div class="nav-item" data-tab="shops" onclick="switchTab('shops')">
        <i class="fas fa-store"></i> Shops
        <span class="badge" id="shopCountBadge">0</span>
      </div>
      <div class="nav-item" data-tab="users" onclick="switchTab('users')">
        <i class="fas fa-users"></i> Users
        <span class="badge" id="userCountBadge">0</span>
      </div>
      <div class="nav-item" data-tab="analytics" onclick="switchTab('analytics')">
        <i class="fas fa-chart-simple"></i> Analytics
      </div>
      <div class="nav-item" data-tab="broadcast" onclick="switchTab('broadcast')">
        <i class="fas fa-bullhorn"></i> Broadcast
      </div>
      <div class="nav-item" data-tab="payments" onclick="switchTab('payments')">
        <i class="fas fa-credit-card"></i> Payments
      </div>
    </nav>
    <div class="spacer"></div>
    <div class="nav-item footer-item" onclick="logout()">
      <i class="fas fa-sign-out-alt"></i> Logout
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main" id="mainContent">
    <!-- Header -->
    <header class="flex items-center justify-between mb-5 flex-wrap gap-3">
      <div class="flex items-center gap-3">
        <h1 class="text-xl font-bold" id="pageTitle">Dashboard</h1>
      </div>
      <div class="flex items-center gap-3 flex-wrap">
        <span class="text-sm text-muted hidden sm:inline" id="adminEmail"></span>
        <a href="/app.html" class="btn btn-ghost btn-sm"><i class="fas fa-arrow-left"></i> App</a>
      </div>
    </header>

    <!-- Dynamic Content -->
    <div id="tabContent"></div>
  </main>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Shop Modal -->
  <div class="modal-overlay" id="shopModal" onclick="if(event.target===this) closeModal('shopModal')">
    <div class="modal">
      <button class="close" onclick="closeModal('shopModal')"><i class="fas fa-times"></i></button>
      <h2 id="shopModalTitle">Shop Details</h2>
      <div id="shopModalBody">Loading...</div>
    </div>
  </div>

  <!-- User Modal -->
  <div class="modal-overlay" id="userModal" onclick="if(event.target===this) closeModal('userModal')">
    <div class="modal">
      <button class="close" onclick="closeModal('userModal')"><i class="fas fa-times"></i></button>
      <h2 id="userModalTitle">User Details</h2>
      <div id="userModalBody">Loading...</div>
    </div>
  </div>

  <script>
    // ================================================================
    // CONFIG & STATE
    // ================================================================
    const API_BASE = 'https://emltechstudio-myshub-api.hf.space';
    const TOKEN_KEY = 'myshub_token';

    let currentTab = 'dashboard';
    let shops = [];
    let users = [];
    let shopPage = 1;
    let userPage = 1;
    const LIMIT = 20;

    // ================================================================
    // UTILITY
    // ================================================================
    function getToken() { return localStorage.getItem(TOKEN_KEY); }
    function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
    function removeToken() { localStorage.removeItem(TOKEN_KEY); }

    function apiFetch(endpoint, options = {}) {
      const token = getToken();
      const headers = {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
        ...options.headers
      };
      return fetch(API_BASE + endpoint, { ...options, headers })
        .then(res => res.ok ? res.json() : res.json().then(err => Promise.reject(err)));
    }

    function showToast(msg, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
      toast.innerHTML = `<i class="fas ${icon}"></i> ${msg}`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
      // Close on outside click handled by overlay
    }

    function formatDate(iso) {
      if (!iso) return '-';
      try { return new Date(iso).toLocaleDateString('en-GB'); } catch { return iso; }
    }

    function truncate(str, n = 20) { return str && str.length > n ? str.slice(0, n) + '…' : str || '-'; }

    // ================================================================
    // AUTH
    // ================================================================
    async function initAuth() {
      const token = getToken();
      if (!token) { window.location.href = '/app.html'; return; }
      try {
        const user = await apiFetch('/admin/me');
        if (!user || !user.email) { throw new Error('Not admin'); }
        document.getElementById('adminEmail').textContent = user.email;
        loadStats();
        switchTab('dashboard');
      } catch (e) {
        removeToken();
        window.location.href = '/app.html';
      }
    }

    function logout() {
      if (confirm('Logout from admin?')) {
        removeToken();
        window.location.href = '/app.html';
      }
    }

    // ================================================================
    // STATS
    // ================================================================
    async function loadStats() {
      try {
        const stats = await apiFetch('/admin/analytics');
        document.getElementById('shopCountBadge').textContent = stats.total_shops || 0;
        document.getElementById('userCountBadge').textContent = stats.total_shops || 0; // user count not directly available
        return stats;
      } catch (e) { return {}; }
    }

    // ================================================================
    // TAB SWITCHING
    // ================================================================
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.querySelector(`.nav-item[data-tab="${tab}"]`)?.classList.add('active');

      const titles = {
        dashboard: 'Dashboard',
        shops: 'Shops',
        users: 'Users',
        analytics: 'Analytics',
        broadcast: 'Broadcast',
        payments: 'Payments'
      };
      document.getElementById('pageTitle').textContent = titles[tab] || 'Admin';

      const content = document.getElementById('tabContent');
      content.innerHTML = `<div class="flex items-center justify-center py-16"><i class="fas fa-spinner fa-spin text-3xl text-indigo-500"></i></div>`;

      switch (tab) {
        case 'dashboard': renderDashboard(); break;
        case 'shops': renderShops(); break;
        case 'users': renderUsers(); break;
        case 'analytics': renderAnalytics(); break;
        case 'broadcast': renderBroadcast(); break;
        case 'payments': renderPayments(); break;
      }
    }

    // ================================================================
    // DASHBOARD
    // ================================================================
    async function renderDashboard() {
      try {
        const stats = await apiFetch('/admin/analytics');
        const html = `
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 stats-grid">
            <div class="stat-card"><div class="value text-indigo-400">${stats.total_shops || 0}</div><div class="label">Total Shops</div></div>
            <div class="stat-card"><div class="value text-emerald-400">${stats.plan_breakdown?.free || 0}</div><div class="label">Free</div></div>
            <div class="stat-card"><div class="value text-blue-400">${stats.plan_breakdown?.pro || 0}</div><div class="label">Pro</div></div>
            <div class="stat-card"><div class="value text-amber-400">${stats.plan_breakdown?.premium || 0}</div><div class="label">Premium</div></div>
            <div class="stat-card"><div class="value text-green-400">${stats.status_breakdown?.active || 0}</div><div class="label">Active</div></div>
            <div class="stat-card"><div class="value text-red-400">${stats.status_breakdown?.expired || 0}</div><div class="label">Expired</div></div>
            <div class="stat-card"><div class="value text-purple-400">₦${(stats.estimated_monthly_revenue_ngn || 0).toLocaleString()}</div><div class="label">Est. Revenue</div></div>
            <div class="stat-card"><div class="value text-pink-400">${stats.referral_stats?.total_referred || 0}</div><div class="label">Referred</div></div>
          </div>
          <div class="grid md:grid-cols-2 gap-4">
            <div class="card">
              <h3 class="font-bold text-sm mb-3 text-muted">🏆 Top Shops by Visits</h3>
              ${stats.top_shops_by_visits?.length ? stats.top_shops_by_visits.slice(0,5).map(s =>
                `<div class="flex items-center justify-between py-2 border-b border-surface-light text-sm">
                  <span><span class="text-indigo-400">${s.slug}</span> <span class="text-xs text-muted">(${s.plan})</span></span>
                  <span class="font-medium">${s.visits}</span>
                </div>`
              ).join('') : '<p class="text-muted text-sm">No data yet</p>'}
            </div>
            <div class="card">
              <h3 class="font-bold text-sm mb-3 text-muted">🌍 Top Countries</h3>
              ${stats.countries ? Object.entries(stats.countries).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([c,v]) =>
                `<div class="flex items-center justify-between py-2 border-b border-surface-light text-sm">
                  <span>${c}</span>
                  <span class="font-medium text-indigo-400">${v}</span>
                </div>`
              ).join('') : '<p class="text-muted text-sm">No data yet</p>'}
            </div>
          </div>
        `;
        document.getElementById('tabContent').innerHTML = html;
      } catch (e) {
        document.getElementById('tabContent').innerHTML = `<div class="card text-center py-8 text-muted"><i class="fas fa-exclamation-triangle text-2xl mb-2"></i><p>Could not load dashboard</p></div>`;
      }
    }

    // ================================================================
    // SHOPS
    // ================================================================
    async function renderShops(page = shopPage) {
      shopPage = page;
      try {
        const params = new URLSearchParams({ page, limit: LIMIT });
        const data = await apiFetch('/admin/shops?' + params);
        shops = data.shops || [];
        const total = data.total || 0;

        const html = `
          <div class="flex flex-wrap items-center gap-3 mb-4">
            <input class="input flex-1 min-w-[160px]" id="shopSearch" placeholder="Search by slug or name..." onkeyup="filterShops(this.value)" />
            <select class="input w-auto min-w-[120px]" id="shopPlanFilter" onchange="filterShops()">
              <option value="">All Plans</option>
              <option value="free">Free</option>
              <option value="pro">Pro</option>
              <option value="premium">Premium</option>
            </select>
            <select class="input w-auto min-w-[120px]" id="shopStatusFilter" onchange="filterShops()">
              <option value="">All Status</option>
              <option value="active">Active</option>
              <option value="expired">Expired</option>
            </select>
            <button class="btn btn-primary btn-sm" onclick="renderShops(1)"><i class="fas fa-sync"></i> Refresh</button>
          </div>
          <div class="card p-0">
            <div class="table-scroll">
              <div class="table-header" style="grid-template-columns:1.5fr 0.8fr 0.8fr 0.8fr 1fr 0.8fr;">
                <div>Shop</div><div>Plan</div><div>Status</div><div>Visits</div><div>Created</div><div>Actions</div>
              </div>
              <div id="shopsList">
                ${shops.map(s => `
                  <div class="table-row" style="grid-template-columns:1.5fr 0.8fr 0.8fr 0.8fr 1fr 0.8fr;">
                    <div><div class="font-medium">${s.business_name || s.slug}</div><div class="text-xs text-muted">${s.slug}</div></div>
                    <div><span class="badge-plan ${s.plan || 'free'}">${s.plan || 'free'}</span></div>
                    <div><span class="badge-status ${s.status === 'active' ? 'active' : 'inactive'}">${s.status || 'expired'}</span></div>
                    <div>${s.visit_count || 0}</div>
                    <div class="text-xs text-muted">${formatDate(s.created_at)}</div>
                    <div class="flex gap-1">
                      <button class="btn btn-ghost btn-xs" onclick="viewShop('${s.slug}')" title="View"><i class="fas fa-eye"></i></button>
                      <button class="btn btn-ghost btn-xs" onclick="toggleShop('${s.slug}', '${s.status}')" title="${s.status === 'active' ? 'Deactivate' : 'Activate'}">
                        <i class="fas ${s.status === 'active' ? 'fa-pause' : 'fa-play'}"></i>
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
              ${shops.length === 0 ? `<div class="text-center py-8 text-muted text-sm">No shops found</div>` : ''}
            </div>
            <div class="flex items-center justify-between p-3 border-t border-surface-light text-sm text-muted flex-wrap gap-2">
              <span>${shops.length > 0 ? `Showing ${(shopPage-1)*LIMIT+1}-${Math.min(shopPage*LIMIT, total)} of ${total}` : '0 shops'}</span>
              <div class="flex gap-2">
                <button class="btn btn-ghost btn-xs" ${shopPage <= 1 ? 'disabled' : ''} onclick="renderShops(${shopPage-1})">← Prev</button>
                <button class="btn btn-ghost btn-xs" ${shopPage*LIMIT >= total ? 'disabled' : ''} onclick="renderShops(${shopPage+1})">Next →</button>
              </div>
            </div>
          </div>
        `;
        document.getElementById('tabContent').innerHTML = html;
      } catch (e) {
        document.getElementById('tabContent').innerHTML = `<div class="card text-center py-8 text-muted"><p>Could not load shops</p></div>`;
      }
    }

    function filterShops(q) {
      const search = document.getElementById('shopSearch')?.value?.toLowerCase() || '';
      const plan = document.getElementById('shopPlanFilter')?.value || '';
      const status = document.getElementById('shopStatusFilter')?.value || '';
      const filtered = shops.filter(s => {
        const matchSearch = !search || (s.slug?.toLowerCase().includes(search) || s.business_name?.toLowerCase().includes(search));
        const matchPlan = !plan || s.plan === plan;
        const matchStatus = !status || s.status === status;
        return matchSearch && matchPlan && matchStatus;
      });
      const list = document.getElementById('shopsList');
      if (!list) return;
      if (filtered.length === 0) {
        list.innerHTML = `<div class="text-center py-8 text-muted text-sm">No shops match your filters</div>`;
      } else {
        list.innerHTML = filtered.map(s => `
          <div class="table-row" style="grid-template-columns:1.5fr 0.8fr 0.8fr 0.8fr 1fr 0.8fr;">
            <div><div class="font-medium">${s.business_name || s.slug}</div><div class="text-xs text-muted">${s.slug}</div></div>
            <div><span class="badge-plan ${s.plan || 'free'}">${s.plan || 'free'}</span></div>
            <div><span class="badge-status ${s.status === 'active' ? 'active' : 'inactive'}">${s.status || 'expired'}</span></div>
            <div>${s.visit_count || 0}</div>
            <div class="text-xs text-muted">${formatDate(s.created_at)}</div>
            <div class="flex gap-1">
              <button class="btn btn-ghost btn-xs" onclick="viewShop('${s.slug}')"><i class="fas fa-eye"></i></button>
              <button class="btn btn-ghost btn-xs" onclick="toggleShop('${s.slug}', '${s.status}')"><i class="fas ${s.status === 'active' ? 'fa-pause' : 'fa-play'}"></i></button>
            </div>
          </div>
        `).join('');
      }
    }

    async function viewShop(slug) {
      const modal = document.getElementById('shopModal');
      modal.classList.add('active');
      document.getElementById('shopModalTitle').textContent = `Shop: ${slug}`;
      document.getElementById('shopModalBody').innerHTML = `<div class="flex items-center justify-center py-8"><i class="fas fa-spinner fa-spin text-xl text-indigo-500"></i></div>`;
      try {
        const data = await apiFetch(`/admin/shop/${slug}`);
        const s = data.shop || data;
        const shopJson = s.shop_json || {};
        const html = `
          <div class="space-y-3 text-sm">
            <div class="flex justify-between"><span class="text-muted">Slug</span><span class="font-medium">${s.slug}</span></div>
            <div class="flex justify-between"><span class="text-muted">Business Name</span><span class="font-medium">${s.business_name || '-'}</span></div>
            <div class="flex justify-between"><span class="text-muted">Email</span><span class="font-medium">${s.email || '-'}</span></div>
            <div class="flex justify-between"><span class="text-muted">Phone</span><span class="font-medium">${s.phone || '-'}</span></div>
            <div class="flex justify-between"><span class="text-muted">Plan</span><span class="badge-plan ${s.plan || 'free'}">${s.plan || 'free'}</span></div>
            <div class="flex justify-between"><span class="text-muted">Status</span><span class="badge-status ${s.status === 'active' ? 'active' : 'inactive'}">${s.status || 'expired'}</span></div>
            <div class="flex justify-between"><span class="text-muted">Visits</span><span class="font-medium">${s.visit_count || 0}</span></div>
            <div class="flex justify-between"><span class="text-muted">Location</span><span class="font-medium">${s.location || '-'}</span></div>
            <div class="flex justify-between"><span class="text-muted">Category</span><span class="font-medium">${s.category || '-'}</span></div>
            <div class="flex justify-between"><span class="text-muted">Created</span><span class="font-medium">${formatDate(s.created_at)}</span></div>
            ${s.expires_at ? `<div class="flex justify-between"><span class="text-muted">Expires</span><span class="font-medium">${formatDate(s.expires_at)}</span></div>` : ''}
            <div class="pt-3 border-t border-surface-light">
              <div class="text-muted text-xs mb-1">Security Questions</div>
              ${s.security_questions?.length ? s.security_questions.map(q => `<div class="text-sm">${q.question}</div>`).join('') : '<span class="text-muted text-xs">None</span>'}
            </div>
            <div class="flex flex-wrap gap-2 pt-3 border-t border-surface-light">
              <button class="btn btn-success btn-sm" onclick="upgradeShop('${s.slug}','pro')">Upgrade Pro</button>
              <button class="btn btn-success btn-sm" onclick="upgradeShop('${s.slug}','premium')">Upgrade Premium</button>
              <button class="btn btn-ghost btn-sm" onclick="toggleShop('${s.slug}','${s.status}'); closeModal('shopModal')">${s.status === 'active' ? 'Deactivate' : 'Activate'}</button>
              <button class="btn btn-danger btn-sm" onclick="resetPassword('${s.slug}')">Reset Password</button>
            </div>
          </div>
        `;
        document.getElementById('shopModalBody').innerHTML = html;
      } catch (e) {
        document.getElementById('shopModalBody').innerHTML = `<p class="text-danger text-sm">Error: ${e.message}</p>`;
      }
    }

    async function toggleShop(slug, currentStatus) {
      const newStatus = currentStatus === 'active' ? 'expired' : 'active';
      if (!confirm(`${newStatus === 'active' ? 'Reactivate' : 'Deactivate'} ${slug}?`)) return;
      try {
        await apiFetch(`/admin/shop/${slug}/status`, {
          method: 'POST',
          body: JSON.stringify({ status: newStatus })
        });
        showToast(`Shop ${slug} ${newStatus === 'active' ? 'activated' : 'deactivated'}`, 'success');
        renderShops(shopPage);
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    async function upgradeShop(slug, plan) {
      if (!confirm(`Upgrade ${slug} to ${plan}?`)) return;
      try {
        await apiFetch(`/admin/shop/${slug}/upgrade`, {
          method: 'POST',
          body: JSON.stringify({ plan })
        });
        showToast(`✅ ${slug} upgraded to ${plan}`, 'success');
        closeModal('shopModal');
        renderShops(shopPage);
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    async function resetPassword(slug) {
      if (!confirm(`Reset password for ${slug}?`)) return;
      try {
        const data = await apiFetch(`/admin/shop/${slug}/reset-password`, { method: 'POST' });
        showToast(`✅ Reset link: ${data.reset_link}`, 'success');
        closeModal('shopModal');
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    // ================================================================
    // USERS
    // ================================================================
    async function renderUsers(page = userPage) {
      userPage = page;
      try {
        const params = new URLSearchParams({ page, limit: LIMIT });
        const data = await apiFetch('/admin/users?' + params);
        users = data.users || [];
        const total = data.total || 0;

        const html = `
          <div class="flex flex-wrap items-center gap-3 mb-4">
            <input class="input flex-1 min-w-[160px]" id="userSearch" placeholder="Search by email..." onkeyup="filterUsers(this.value)" />
            <button class="btn btn-primary btn-sm" onclick="renderUsers(1)"><i class="fas fa-sync"></i> Refresh</button>
          </div>
          <div class="card p-0">
            <div class="table-scroll">
              <div class="table-header" style="grid-template-columns:1.5fr 1fr 0.8fr 0.8fr 0.8fr;">
                <div>User</div><div>Shop</div><div>Plan</div><div>Joined</div><div>Actions</div>
              </div>
              <div id="usersList">
                ${users.map(u => `
                  <div class="table-row" style="grid-template-columns:1.5fr 1fr 0.8fr 0.8fr 0.8fr;">
                    <div><div class="font-medium">${u.email}</div><div class="text-xs text-muted">${u.phone || ''}</div></div>
                    <div class="text-sm">${u.shop_name || '-'}</div>
                    <div><span class="badge-plan ${u.plan || 'free'}">${u.plan || 'free'}</span></div>
                    <div class="text-xs text-muted">${formatDate(u.created_at)}</div>
                    <div><button class="btn btn-ghost btn-xs" onclick="viewUser('${u.email}')"><i class="fas fa-eye"></i></button></div>
                  </div>
                `).join('')}
              </div>
              ${users.length === 0 ? `<div class="text-center py-8 text-muted text-sm">No users found</div>` : ''}
            </div>
            <div class="flex items-center justify-between p-3 border-t border-surface-light text-sm text-muted flex-wrap gap-2">
              <span>${users.length > 0 ? `Showing ${(userPage-1)*LIMIT+1}-${Math.min(userPage*LIMIT, total)} of ${total}` : '0 users'}</span>
              <div class="flex gap-2">
                <button class="btn btn-ghost btn-xs" ${userPage <= 1 ? 'disabled' : ''} onclick="renderUsers(${userPage-1})">← Prev</button>
                <button class="btn btn-ghost btn-xs" ${userPage*LIMIT >= total ? 'disabled' : ''} onclick="renderUsers(${userPage+1})">Next →</button>
              </div>
            </div>
          </div>
        `;
        document.getElementById('tabContent').innerHTML = html;
      } catch (e) {
        document.getElementById('tabContent').innerHTML = `<div class="card text-center py-8 text-muted"><p>Could not load users</p></div>`;
      }
    }

    function filterUsers(q) {
      const search = document.getElementById('userSearch')?.value?.toLowerCase() || '';
      const filtered = users.filter(u => u.email?.toLowerCase().includes(search) || u.shop_name?.toLowerCase().includes(search));
      const list = document.getElementById('usersList');
      if (!list) return;
      if (filtered.length === 0) {
        list.innerHTML = `<div class="text-center py-8 text-muted text-sm">No users match</div>`;
      } else {
        list.innerHTML = filtered.map(u => `
          <div class="table-row" style="grid-template-columns:1.5fr 1fr 0.8fr 0.8fr 0.8fr;">
            <div><div class="font-medium">${u.email}</div><div class="text-xs text-muted">${u.phone || ''}</div></div>
            <div class="text-sm">${u.shop_name || '-'}</div>
            <div><span class="badge-plan ${u.plan || 'free'}">${u.plan || 'free'}</span></div>
            <div class="text-xs text-muted">${formatDate(u.created_at)}</div>
            <div><button class="btn btn-ghost btn-xs" onclick="viewUser('${u.email}')"><i class="fas fa-eye"></i></button></div>
          </div>
        `).join('');
      }
    }

    async function viewUser(email) {
      const modal = document.getElementById('userModal');
      modal.classList.add('active');
      document.getElementById('userModalTitle').textContent = `User: ${email}`;
      document.getElementById('userModalBody').innerHTML = `<div class="flex items-center justify-center py-8"><i class="fas fa-spinner fa-spin text-xl text-indigo-500"></i></div>`;
      try {
        const data = await apiFetch(`/admin/user/${email}`);
        const u = data.user || data;
        const html = `
          <div class="space-y-3 text-sm">
            <div class="flex justify-between"><span class="text-muted">Email</span><span class="font-medium">${u.email}</span></div>
            <div class="flex justify-between"><span class="text-muted">Phone</span><span class="font-medium">${u.phone || '-'}</span></div>
            <div class="flex justify-between"><span class="text-muted">Shop</span><span class="font-medium">${u.shop_name || '-'}</span></div>
            <div class="flex justify-between"><span class="text-muted">Plan</span><span class="badge-plan ${u.plan || 'free'}">${u.plan || 'free'}</span></div>
            <div class="flex justify-between"><span class="text-muted">Status</span><span class="badge-status ${u.status === 'active' ? 'active' : 'inactive'}">${u.status || 'expired'}</span></div>
            <div class="flex justify-between"><span class="text-muted">Joined</span><span class="font-medium">${formatDate(u.created_at)}</span></div>

              <div class="pt-2 border-t border-surface-light"><div class="text-muted text-xs mb-1">Security Questions</div>
              ${u.security_questions.map(q => `<div class="text-sm">${q.question}</div>`).join('')}</div>
            ` : ''}
          </div>

        document.getElementById('userModalBody').innerHTML = html;
      } catch (e) {
        document.getElementById('userModalBody').innerHTML = `<p class="text-danger text-sm">Error: ${e.message}</p>`;
      }
    }

    // ================================================================
    // ANALYTICS
    // ================================================================

      try {
        const stats = await apiFetch('/admin/analytics');
        const total = stats.total_shops || 0;

        const pro = stats.plan_breakdown?.pro || 0;
        const premium = stats.plan_breakdown?.premium || 0;
        const active = stats.status_breakdown?.active || 0;
        const expired = stats.status_breakdown?.expired || 0;

        const html = `
          <div class="grid md:grid-cols-2 gap-4">
            <div class="card">
              <h3 class="font-bold text-sm mb-4 text-muted">📊 Plan Distribution</h3>
              <div class="space-y-3">
                <div><div class="flex justify-between text-sm"><span>Free</span><span>${free} (${total ? Math.round(free/total*100) : 0}%)</span></div>
                  <div class="w-full bg-[#0f172a] rounded-full h-2 mt-1"><div class="bg-[#94a3b8] h-2 rounded-full" style="width:${total ? Math.round(free/total*100) : 0}%"></div></div></div>
                <div><div class="flex justify-between text-sm"><span>Pro</span><span>${pro} (${total ? Math.round(pro/total*100) : 0}%)</span></div>

                <div><div class="flex justify-between text-sm"><span>Premium</span><span>${premium} (${total ? Math.round(premium/total*100) : 0}%)</span></div>
                  <div class="w-full bg-[#0f172a] rounded-full h-2 mt-1"><div class="bg-amber-400 h-2 rounded-full" style="width:${total ? Math.round(premium/total*100) : 0}%"></div></div></div>
              </div>
            </div>
            <div class="card">
              <h3 class="font-bold text-sm mb-4 text-muted">🔄 Status Breakdown</h3>
              <div class="space-y-3">
                <div><div class="flex justify-between text-sm"><span>Active</span><span>${active} (${total ? Math.round(active/total*100) : 0}%)</span></div>
                  <div class="w-full bg-[#0f172a] rounded-full h-2 mt-1"><div class="bg-green-500 h-2 rounded-full" style="width:${total ? Math.round(active/total*100) : 0}%"></div></div></div>
                <div><div class="flex justify-between text-sm"><span>Expired</span><span>${expired} (${total ? Math.round(expired/total*100) : 0}%)</span></div>

            </div>

              <h3 class="font-bold text-sm mb-3 text-muted">🌍 Countries</h3>
              ${stats.countries ? Object.entries(stats.countries).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([c,v]) =>

              ).join('') : '<p class="text-muted text-sm">No data</p>'}
            </div>
            <div class="card">
              <h3 class="font-bold text-sm mb-3 text-muted">💰 Revenue</h3>
              <div class="text-2xl font-bold text-emerald-400 mb-1">₦${(stats.estimated_monthly_revenue_ngn || 0).toLocaleString()}</div>
              <div class="text-xs text-muted">Estimated monthly revenue</div>
              <div class="mt-4 pt-3 border-t border-surface-light">
                <div class="flex justify-between text-sm"><span class="text-muted">Referral codes</span><span>${stats.referral_stats?.total_referral_codes || 0}</span></div>
                <div class="flex justify-between text-sm"><span class="text-muted">Total referred</span><span>${stats.referral_stats?.total_referred || 0}</span></div>
              </div>
            </div>
          </div>

        document.getElementById('tabContent').innerHTML = `<div class="card text-center py-8 text-muted"><p>Could not load analytics</p></div>`;

    // ================================================================
    // BROADCAST
    // ================================================================
    function renderBroadcast() {
      const html = `
        <div class="card max-w-xl">
          <h3 class="font-bold mb-4">📢 Send Broadcast</h3>
          <div class="space-y-3">
            <div><label class="text-sm text-muted block mb-1">Target</label>
              <select id="broadcastTarget" class="input">
                <option value="all">All Users</option>
                <option value="free">Free Users</option>
                <option value="pro">Pro Users</option>
                <option value="premium">Premium Users</option>
              </select>
            </div>
            <div><label class="text-sm text-muted block mb-1">Title</label>
              <input class="input" id="broadcastTitle" placeholder="Notification title" />
            </div>
            <div><label class="text-sm text-muted block mb-1">Message</label>
              <textarea class="input" id="broadcastBody" rows="4" placeholder="Write your message..."></textarea>
            </div>
            <button class="btn btn-primary w-full justify-center" onclick="sendBroadcast()"><i class="fas fa-paper-plane"></i> Send Broadcast</button>
            <div id="broadcastResult" class="text-sm mt-2"></div>
          </div>
        </div>
      `;
      document.getElementById('tabContent').innerHTML = html;
    }

    async function sendBroadcast() {
      const target = document.getElementById('broadcastTarget').value;
      const title = document.getElementById('broadcastTitle').value.trim();
      const body = document.getElementById('broadcastBody').value.trim();
      if (!title || !body) { showToast('Title and message required', 'error'); return; }
      const btn = document.querySelector('#tabContent .btn-primary');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
      try {
        const result = await apiFetch('/admin/broadcast', {
          method: 'POST',
          body: JSON.stringify({ target, title, body })
        });
        showToast(`✅ Broadcast sent to ${result.sent || 0} users`, 'success');
        document.getElementById('broadcastTitle').value = '';
        document.getElementById('broadcastBody').value = '';
        document.getElementById('broadcastResult').innerHTML = `<span class="text-green-400">Sent successfully!</span>`;
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
        document.getElementById('broadcastResult').innerHTML = `<span class="text-red-400">Error: ${e.message}</span>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Broadcast';
      }
    }

    // ================================================================
    // PAYMENTS
    // ================================================================
    function renderPayments() {
      document.getElementById('tabContent').innerHTML = `
        <div class="card">
          <h3 class="font-bold mb-4">💳 Payment Transactions</h3>
          <div class="table-scroll">
            <div class="table-header" style="grid-template-columns:1.5fr 1fr 1fr 0.8fr 1fr;">
              <div>User</div><div>Plan</div><div>Amount</div><div>Status</div><div>Date</div>
            </div>
            <div class="text-center py-12 text-muted">
              <i class="fas fa-receipt text-3xl mb-2 block"></i>
              <p>No payment transactions yet</p>
            </div>
          </div>
        </div>
      `;
    }

    // ================================================================
    // INIT
    // ================================================================
    initAuth();

    // Auto-refresh dashboard when visible
    setInterval(() => {
      if (currentTab === 'dashboard') renderDashboard();
      else if (currentTab === 'shops') renderShops(shopPage);
      else if (currentTab === 'users') renderUsers(userPage);
    }, 60000);
  </script>
