name: Generate MyShub SEO pages

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: myshub-seo-generation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MyShub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate static shop SEO pages
        run: python3 seo-pages/generate.py

      - name: Commit generated pages when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo-pages sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated SEO changes."
            exit 0
          fi
          git commit -m "chore: refresh MyShub SEO pages"
          git push
