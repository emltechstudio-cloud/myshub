<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics – MyShub</title>
  <style>
    .analytics-page { padding: 0; color: var(--text, #0f172a); }
    .analytics-page * { box-sizing: border-box; }
    .analytics-header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; }
    .analytics-header h2 { margin:0; font-size:24px; font-weight:850; letter-spacing:-.02em; }
    .analytics-header p { margin:5px 0 0; color:var(--text-secondary,#64748b); font-size:13px; }
    .plan-pill { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:7px 11px; background:var(--brand-soft,#eff6ff); color:var(--brand,#2563eb); font-size:11px; font-weight:800; white-space:nowrap; }
    .plan-pill.premium { background:#fff7ed; color:#c2410c; }
    .period-bar { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:10px; margin-bottom:16px; border:1px solid var(--border,#e2e8f0); border-radius:16px; background:var(--surface,#fff); }
    .period-buttons { display:flex; gap:6px; flex-wrap:wrap; }
    .period-button { border:1px solid transparent; background:transparent; color:var(--text-secondary,#64748b); border-radius:10px; padding:8px 12px; font-size:12px; font-weight:750; cursor:pointer; }
    .period-button:hover { background:var(--surface-hover,#f8fafc); color:var(--text,#0f172a); }
    .period-button.active { background:var(--brand,#2563eb); color:#fff; }
    .period-button.locked { opacity:.55; }
    .updated-note { font-size:11px; color:var(--text-tertiary,#94a3b8); }
    .summary-grid { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; margin-bottom:16px; }
    .stat-card, .analytics-card { background:var(--surface,#fff); border:1px solid var(--border,#e2e8f0); border-radius:18px; box-shadow:0 2px 9px rgba(15,23,42,.035); }
    .stat-card { padding:16px; min-height:116px; }
    .stat-label { color:var(--text-secondary,#64748b); font-size:11px; font-weight:750; text-transform:uppercase; letter-spacing:.045em; }
    .stat-value { margin-top:9px; font-size:27px; line-height:1.1; font-weight:900; letter-spacing:-.025em; color:var(--brand,#2563eb); }
    .stat-help { margin-top:7px; color:var(--text-tertiary,#94a3b8); font-size:11px; }
    .change-up { color:#15803d; font-weight:800; }
    .change-down { color:#b91c1c; font-weight:800; }
    .analytics-card { padding:18px; margin-bottom:16px; }
    .card-heading { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px; }
    .card-heading h3 { margin:0; font-size:16px; font-weight:850; }
    .card-heading p { margin:4px 0 0; color:var(--text-secondary,#64748b); font-size:12px; line-height:1.45; }
    .card-badge { border-radius:999px; padding:4px 8px; font-size:10px; font-weight:800; white-space:nowrap; background:var(--brand-soft,#eff6ff); color:var(--brand,#2563eb); }
    .card-badge.premium { background:#fff7ed; color:#c2410c; }
    .trend-chart { display:flex; align-items:flex-end; gap:5px; height:190px; padding:10px 2px 0; overflow-x:auto; }
    .trend-bar { min-width:24px; flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px; }
    .bar-value { font-size:9px; color:var(--text-secondary,#64748b); white-space:nowrap; }
    .bar-track { width:100%; max-width:32px; height:145px; border-radius:7px 7px 2px 2px; background:var(--border-light,#f1f5f9); display:flex; align-items:flex-end; overflow:hidden; }
    .bar-stack { width:100%; display:flex; flex-direction:column; justify-content:flex-end; }
    .bar-visits { background:linear-gradient(180deg,#3b82f6,#2563eb); }
    .bar-actions { background:linear-gradient(180deg,#f59e0b,#ea580c); }
    .bar-label { max-width:48px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-tertiary,#94a3b8); font-size:9px; }
    .legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; color:var(--text-secondary,#64748b); font-size:11px; }
    .legend span { display:inline-flex; align-items:center; gap:5px; }
    .legend i { display:inline-block; width:9px; height:9px; border-radius:3px; }
    .legend .visits-dot { background:#2563eb; }
    .legend .actions-dot { background:#ea580c; }
    .two-col { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .metric-list { display:flex; flex-direction:column; gap:10px; }
    .metric-row { display:grid; grid-template-columns:minmax(90px,1fr) minmax(70px,1.5fr) auto; gap:10px; align-items:center; font-size:12px; }
    .metric-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text,#0f172a); }
    .metric-track { height:8px; border-radius:99px; background:var(--border-light,#f1f5f9); overflow:hidden; }
    .metric-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--brand,#2563eb),#7c3aed); }
    .metric-value { min-width:76px; text-align:right; color:var(--text-secondary,#64748b); font-variant-numeric:tabular-nums; }
    .breakdown-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
    .breakdown-item { padding:12px; border:1px solid var(--border-light,#f1f5f9); border-radius:13px; background:var(--surface-hover,#f8fafc); }
    .breakdown-item .name { color:var(--text-secondary,#64748b); font-size:11px; text-transform:capitalize; }
    .breakdown-item .number { margin-top:6px; font-size:22px; font-weight:850; }
    .breakdown-item .percent { margin-top:3px; font-size:11px; color:var(--text-tertiary,#94a3b8); }
    .insight-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .insight { padding:13px; border-left:3px solid var(--brand,#2563eb); border-radius:10px; background:var(--surface-hover,#f8fafc); color:var(--text-secondary,#475569); font-size:12px; line-height:1.5; }
    .insight strong { color:var(--text,#0f172a); }
    .locked-box { position:relative; overflow:hidden; min-height:140px; }
    .locked-content { filter:blur(4px); opacity:.55; pointer-events:none; }
    .locked-overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; padding:20px; text-align:center; background:rgba(255,255,255,.74); backdrop-filter:blur(2px); color:var(--text-secondary,#64748b); font-size:12px; font-weight:700; }
    [data-theme="dark"] .locked-overlay { background:rgba(15,23,42,.84); }
    .upgrade-button, .export-button { border:0; border-radius:10px; padding:8px 13px; color:#fff; background:var(--brand,#2563eb); font-size:12px; font-weight:800; cursor:pointer; }
    .export-row { display:flex; justify-content:flex-end; gap:8px; }
    .empty { padding:22px 6px; color:var(--text-tertiary,#94a3b8); text-align:center; font-size:12px; }
    .error-state { padding:55px 20px; text-align:center; color:var(--text-secondary,#64748b); }
    .error-state h3 { margin:0 0 7px; color:var(--text,#0f172a); }
    .loading { padding:55px 20px; text-align:center; color:var(--text-secondary,#64748b); }
    .spinner { width:34px; height:34px; margin:0 auto 12px; border:4px solid var(--border,#e2e8f0); border-top-color:var(--brand,#2563eb); border-radius:50%; animation:spin .9s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (max-width:800px) { .summary-grid{grid-template-columns:repeat(2,minmax(0,1fr));} .two-col{grid-template-columns:1fr;} .breakdown-grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
    @media (max-width:520px) { .analytics-header{display:block;} .plan-pill{margin-top:12px;} .summary-grid{gap:8px;} .stat-card{padding:13px;min-height:105px;} .stat-value{font-size:23px;} .analytics-card{padding:14px;} .insight-list{grid-template-columns:1fr;} .metric-row{grid-template-columns:90px minmax(60px,1fr) auto;gap:6px;} }
  </style>
</head>
<body>
  <main class="analytics-page" id="analyticsApp">
    <div class="loading"><div class="spinner"></div>Loading analytics…</div>
  </main>
  <script>
  (function () {
    'use strict';

    const API = window.API || 'https://emltechstudio-myshub-api.hf.space';
    const state = { period: '30d', plan: 'free', data: null, session: null };

    function session() {
      if (window.S && window.S.email) return window.S;
      try { return JSON.parse(localStorage.getItem('myshub_session') || 'null'); } catch (_) { return null; }
    }
    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (m) {
        return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[m];
      });
    }
    function number(value) { return Number(value || 0).toLocaleString(); }
    function pct(value) { return (Number(value || 0).toFixed(1)).replace('.0','') + '%'; }
    function planName(plan) { return plan === 'premium' ? 'Premium analytics' : plan === 'pro' ? 'Pro analytics' : 'Basic analytics'; }
    function navigate(page) { if (typeof window.loadPage === 'function') window.loadPage(page); }
    function notify(message, type) { if (typeof window.toast === 'function') window.toast(message, type); else alert(message); }

    async function load(period) {
      const s = state.session;
      if (!s || !s.slug || !s.email || !s.password) throw new Error('Please sign in to view your analytics.');
      const response = await fetch(API + '/shop/analytics/' + encodeURIComponent(s.slug) + '?period=' + encodeURIComponent(period), {
        headers: { 'email': s.email, 'password': s.password, 'Accept': 'application/json' }
      });
      if (!response.ok) throw new Error(response.status === 403 ? 'You are not allowed to view this shop analytics report.' : 'Analytics could not be loaded.');
      return response.json();
    }

    function renderPeriodButtons() {
      const items = [
        ['today','Today',false], ['7d','7 days',false], ['30d','30 days',false],
        ['90d','90 days',state.plan === 'free'], ['365d','12 months',state.plan !== 'premium']
      ];
      return items.map(function (item) {
        const locked = item[2];
        return '<button class="period-button ' + (state.period === item[0] ? 'active ' : '') + (locked ? 'locked' : '') + '" data-period="' + item[0] + '" ' + (locked ? 'title="Available on a higher plan"' : '') + '>' + item[1] + (locked ? ' ·' : '') + '</button>';
      }).join('');
    }

    function metricRows(data, emptyLabel) {
      const entries = Object.entries(data || {}).map(function (entry) {
        const key = entry[0], value = entry[1];
        return [key, Number(value && typeof value === 'object' ? value.count : value) || 0, Number(value && typeof value === 'object' ? value.percentage : 0) || 0];
      }).sort(function (a,b) { return b[1] - a[1]; });
      if (!entries.length) return '<div class="empty">' + esc(emptyLabel || 'No data for this period yet.') + '</div>';
      const max = Math.max.apply(null, entries.map(function (e) { return e[1]; }).concat([1]));
      return '<div class="metric-list">' + entries.slice(0, 10).map(function (e) {
        return '<div class="metric-row"><div class="metric-name" title="' + esc(e[0]) + '">' + esc(e[0]) + '</div><div class="metric-track"><div class="metric-fill" style="width:' + Math.max(3, (e[1] / max) * 100) + '%"></div></div><div class="metric-value">' + number(e[1]) + ' · ' + pct(e[2]) + '</div></div>';
      }).join('') + '</div>';
    }

    function breakdown(data) {
      const entries = Object.entries(data || {});
      if (!entries.length) return '<div class="empty">No actions recorded for this period yet.</div>';
      return '<div class="breakdown-grid">' + entries.map(function (entry) {
        const item = entry[1] || {};
        return '<div class="breakdown-item"><div class="name">' + esc(entry[0].replace(/_/g,' ')) + '</div><div class="number">' + number(item.count) + '</div><div class="percent">' + pct(item.percentage) + ' of actions</div></div>';
      }).join('') + '</div>';
    }

    function chart(rows) {
      if (!rows || !rows.length) return '<div class="empty">No daily trend data yet.</div>';
      const max = Math.max.apply(null, rows.map(function (r) { return Math.max(Number(r.visits || 0), Number(r.actions || 0)); }).concat([1]));
      return '<div class="trend-chart">' + rows.map(function (row) {
        const visits = Number(row.visits || 0), actions = Number(row.actions || 0);
        const totalHeight = Math.max(3, (Math.max(visits, actions) / max) * 100);
        const actionsHeight = actions ? Math.max(2, (actions / Math.max(visits, actions)) * 100) : 0;
        const label = new Date(row.date + 'T00:00:00Z').toLocaleDateString(undefined, {month:'short', day:'numeric'});
        return '<div class="trend-bar" title="' + esc(label) + ': ' + number(visits) + ' visits, ' + number(actions) + ' actions"><div class="bar-value">' + number(visits) + '</div><div class="bar-track"><div class="bar-stack" style="height:' + totalHeight + '%"><div class="bar-actions" style="height:' + actionsHeight + '%"></div><div class="bar-visits" style="height:' + Math.max(8, 100 - actionsHeight) + '%"></div></div></div><div class="bar-label">' + esc(label) + '</div></div>';
      }).join('') + '</div><div class="legend"><span><i class="visits-dot"></i>Visits</span><span><i class="actions-dot"></i>Actions</span></div>';
    }

    function insights(data) {
      const summary = data.summary || {}, referrers = data.referrers || {}, countries = data.countries || {}, devices = data.devices || {};
      const top = function (obj) { return Object.entries(obj).sort(function(a,b){return Number((b[1]||{}).count||b[1]||0)-Number((a[1]||{}).count||a[1]||0);})[0]; };
      const list = [];
      const ref = top(referrers), country = top(countries), device = top(devices);
      if (ref) list.push('<strong>Strongest source:</strong> ' + esc(ref[0]) + ' brought ' + number(ref[1].count || ref[1]) + ' visits in this period.');
      if (country) list.push('<strong>Top audience location:</strong> ' + esc(country[0]) + ' accounted for ' + pct(country[1].percentage || 0) + ' of recorded visits.');
      if (device) list.push('<strong>Primary device:</strong> ' + esc(device[0]) + ' represented ' + pct(device[1].percentage || 0) + ' of recorded visitors.');
      if (summary.actions > 0) list.push('<strong>Engagement:</strong> visitors generated ' + number(summary.actions) + ' tracked actions, an action rate of ' + pct(summary.action_rate) + '.');
      else if (summary.visits > 0) list.push('<strong>Next opportunity:</strong> visitors are arriving, but no tracked actions were recorded in this period yet.');
      if (!list.length) list.push('Share your shop and start collecting enough activity for useful insights.');
      return '<div class="insight-list">' + list.slice(0,4).map(function (x) { return '<div class="insight">' + x + '</div>'; }).join('') + '</div>';
    }

    function lockedCard(title, plan, description) {
      return '<section class="analytics-card locked-box"><div class="locked-content"><div class="card-heading"><div><h3>' + esc(title) + '</h3><p>' + esc(description) + '</p></div></div><div style="height:100px;background:var(--border-light,#f1f5f9);border-radius:12px"></div></div><div class="locked-overlay"><div>' + esc(plan) + ' analytics includes this insight.</div><button class="upgrade-button" onclick="window.loadPage && window.loadPage(\'upgrade\')">View plans</button></div></section>';
    }

    function exportCsv() {
      const data = state.data || {}, summary = data.summary || {};
      const rows = [['Metric','Value'], ['Period', state.period], ['From', data.from || ''], ['To', data.to || ''], ['Visits', summary.visits || 0], ['Actions', summary.actions || 0], ['Action rate', summary.action_rate || 0]];
      Object.entries(data.referrers || {}).forEach(function (e) { rows.push(['Referrer: ' + e[0], e[1].count || 0]); });
      Object.entries(data.countries || {}).forEach(function (e) { rows.push(['Country: ' + e[0], e[1].count || 0]); });
      Object.entries(data.devices || {}).forEach(function (e) { rows.push(['Device: ' + e[0], e[1].count || 0]); });
      (data.daily || []).forEach(function (r) { rows.push(['Visits ' + r.date, r.visits || 0]); rows.push(['Actions ' + r.date, r.actions || 0]); });
      const csv = rows.map(function (row) { return row.map(function (cell) { return '"' + String(cell == null ? '' : cell).replace(/"/g,'""') + '"'; }).join(','); }).join('\n');
      const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
      const link = document.createElement('a'); link.href = url; link.download = 'myshub-analytics-' + state.period + '-' + new Date().toISOString().slice(0,10) + '.csv'; link.click(); URL.revokeObjectURL(url); notify('Analytics exported.', 'success');
    }

    function render() {
      const app = document.getElementById('analyticsApp');
      if (!app) return;
      const data = state.data || {}, summary = data.summary || {}, plan = state.plan;
      const isPro = plan === 'pro' || plan === 'premium', isPremium = plan === 'premium';
      const change = summary.visits_change_percentage;
      const changeText = change == null ? 'No previous baseline' : ((change >= 0 ? '+' : '') + change + '% vs previous period');
      const changeClass = change == null ? '' : (change >= 0 ? 'change-up' : 'change-down');
      const clicks = summary.click_breakdown || {};
      let html = '<div class="analytics-header"><div><h2>Analytics</h2><p>Understand who visits your hub, where they come from, and what they do.</p></div><span class="plan-pill ' + (isPremium ? 'premium' : '') + '">' + esc(planName(plan)) + '</span></div>';
      html += '<div class="period-bar"><div class="period-buttons">' + renderPeriodButtons() + '</div><div class="updated-note">' + (data.last_updated ? 'Updated ' + esc(new Date(data.last_updated).toLocaleString()) : 'Live period report') + '</div></div>';
      html += '<section class="summary-grid"><div class="stat-card"><div class="stat-label">Visits</div><div class="stat-value">' + number(summary.visits) + '</div><div class="stat-help">Selected period</div></div><div class="stat-card"><div class="stat-label">Tracked actions</div><div class="stat-value">' + (isPro ? number(summary.actions) : '—') + '</div><div class="stat-help">Catalog, WhatsApp, socials and links</div></div><div class="stat-card"><div class="stat-label">Action rate</div><div class="stat-value">' + (isPro ? pct(summary.action_rate) : '—') + '</div><div class="stat-help">Actions compared with visits</div></div><div class="stat-card"><div class="stat-label">Period change</div><div class="stat-value ' + changeClass + '" style="font-size:20px">' + (isPro ? esc(changeText) : '—') + '</div><div class="stat-help">Compared with previous period</div></div></section>';
      html += '<section class="analytics-card"><div class="card-heading"><div><h3>Visits and actions</h3><p>See whether traffic is turning into meaningful engagement.</p></div></div>' + chart(data.daily || []) + '</section>';
      html += '<section class="analytics-card"><div class="card-heading"><div><h3>Click performance</h3><p>How visitors interacted with the actions available on your hub.</p></div><span class="card-badge">' + (isPro ? 'Raw numbers' : 'Pro') + '</span></div>' + (isPro ? breakdown(clicks) : '<div class="locked-box">' + lockedCard('Click performance','Pro','Review raw clicks and engagement rates.').replace(/^<section class="analytics-card locked-box">|<\/section>$/g,'') + '</div>') + '</section>';
      html += '<div class="two-col">';
      if (isPro) html += '<section class="analytics-card"><div class="card-heading"><div><h3>Top referrers</h3><p>Where visitors came from during this period.</p></div></div>' + metricRows(data.referrers, 'No referrer data yet.') + '</section>'; else html += lockedCard('Top referrers','Pro','See which sources send visitors to your hub.');
      if (isPro) html += '<section class="analytics-card"><div class="card-heading"><div><h3>Audience locations</h3><p>Countries represented in your recorded visits.</p></div></div>' + metricRows(data.countries, 'No country data yet.') + '</section>'; else html += lockedCard('Audience locations','Pro','Understand where your visitors are located.');
      html += '</div>';
      if (isPremium) {
        html += '<div class="two-col"><section class="analytics-card"><div class="card-heading"><div><h3>Devices</h3><p>Optimize your hub for the devices visitors use.</p></div><span class="card-badge premium">Premium</span></div>' + metricRows(data.devices, 'No device data yet.') + '</section><section class="analytics-card"><div class="card-heading"><div><h3>Premium export</h3><p>Download this period’s raw summary for your records.</p></div><span class="card-badge premium">Premium</span></div><div class="export-row"><button class="export-button" id="exportCsv">Export CSV</button></div></section></div>';
      } else {
        html += lockedCard('Device intelligence and export','Premium','Get device percentages, longer history, and downloadable analytics.');
      }
      html += '<section class="analytics-card"><div class="card-heading"><div><h3>What this means</h3><p>Simple interpretation of the current period—not a promise of completed sales.</p></div></div>' + insights(data) + '</section>';
      html += '<p style="margin:2px 2px 20px;color:var(--text-tertiary,#94a3b8);font-size:11px;line-height:1.5">Visits are tracked public hub visits; owner previews are excluded. Actions count available tracked buttons and do not guarantee a completed sale. Unique visitors are not presented unless the backend has measured them separately.</p>';
      app.innerHTML = html;
      document.querySelectorAll('[data-period]').forEach(function (button) { button.addEventListener('click', function () { if (button.classList.contains('locked')) { navigate('upgrade'); return; } state.period = button.dataset.period; refresh(); }); });
      const exportButton = document.getElementById('exportCsv'); if (exportButton) exportButton.addEventListener('click', exportCsv);
    }

    async function refresh() {
      const app = document.getElementById('analyticsApp');
      if (app && !state.data) app.innerHTML = '<div class="loading"><div class="spinner"></div>Loading analytics…</div>';
      try { state.data = await load(state.period); state.plan = state.data.plan || state.session.plan || 'free'; render(); }
      catch (error) { if (app) app.innerHTML = '<div class="error-state"><h3>Analytics unavailable</h3><p>' + esc(error.message || 'Please try again.') + '</p><button class="upgrade-button" id="retryAnalytics">Try again</button></div>'; const retry = document.getElementById('retryAnalytics'); if (retry) retry.addEventListener('click', refresh); }
    }

    state.session = session();
    state.plan = (state.session && state.session.plan) || 'free';
    window.exportShopAnalytics = exportCsv;
    refresh();
  })();
  </script>
</body>
</html>
